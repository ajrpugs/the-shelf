  if (pendingMeta.has(key)) return pendingMeta.get(key);
  const promise = enqueueMeta(() => fetchBookMeta(rawTitle)).then(meta => {
    // Only persist real hits — a miss (network blip, no match) stays uncached
    // so the next visit retries instead of showing a permanent blank.
    if (metaHasData(meta)) {
      bookMetaCache[key] = meta;
      try { localStorage.setItem(META_CACHE_KEY, JSON.stringify(bookMetaCache)); } catch {}
    }
    return meta;
  }).finally(() => { pendingMeta.delete(key); });
  pendingMeta.set(key, promise);
  return promise;
}

async function resolveCover(rawTitle) {
  return (await resolveBookMeta(rawTitle)).cover;
}

function fmtMeta(meta) {
  if (!meta) return "";
  const bits = [];
  if (meta.year) bits.push(String(meta.year));
  if (meta.pages) bits.push(`${meta.pages}pp`);
  return bits.join(" · ");
}

function insertCoverImg(el, url) {
  const img = document.createElement("img");
  img.src = url;
  img.alt = "";
  img.loading = "lazy";
  el.appendChild(img);
}

function decorateCovers() {
  document.querySelectorAll(".cover-slot[data-cover-title]").forEach(el => {
    if (el.dataset.coverDone === "1") return;
    el.dataset.coverDone = "1";
    const raw = el.dataset.coverTitle;
    const key = normalizeForMatch(raw);
    if (!key) { el.classList.add("no-cover"); return; }
    const apply = (meta) => {
      if (meta && meta.cover) insertCoverImg(el, meta.cover);
      else el.classList.add("no-cover");
    };
    if (key in bookMetaCache) apply(bookMetaCache[key]);
    else resolveBookMeta(raw).then(apply);
  });
}

// On the shelf: only turn a title into a link once we know Open Library has a
// match for it (otherwise the detail page would be empty), so unmatched books
// stay as plain text.
function decorateShelfLinks() {
  document.querySelectorAll(".shelf-title[data-shelf-id]").forEach(el => {
    if (el.dataset.linkDone === "1") return;
    const raw = el.dataset.linkTitle;
    const id = el.dataset.shelfId;
    const key = normalizeForMatch(raw);
    if (!key) return;
    const apply = (meta) => {
      if (!metaHasData(meta)) return; // no match — leave it plain
      el.dataset.linkDone = "1";
      el.innerHTML = `<a class="book-link" href="#shelf=${encodeURIComponent(id)}">${esc(raw)}</a>`;
    };
    if (key in bookMetaCache) apply(bookMetaCache[key]);
    else resolveBookMeta(raw).then(apply);
  });
}

// Fill "· 1984 · 317pp" spans once the metadata resolves.
function decorateMeta() {
  document.querySelectorAll(".book-meta[data-meta-title]").forEach(el => {
    if (el.dataset.metaDone === "1") return;
    el.dataset.metaDone = "1";
    const raw = el.dataset.metaTitle;
    const key = normalizeForMatch(raw);
    if (!key) return;
    const apply = (meta) => { const t = fmtMeta(meta); if (t) el.textContent = t; };
    if (key in bookMetaCache) apply(bookMetaCache[key]);
    else resolveBookMeta(raw).then(apply);
  });
}

// Subjects from Open Library are noisy — strip catalog/accessibility cruft and
// tagged (`nyt:...`) entries, leaving human-readable genres/themes.
const SUBJECT_STOP = [
  "accessible book", "protected daisy", "in library", "internet archive",
  "open library staff picks", "overdrive", "large type books", "reading level",
  "lending library", "print disabled", "container", "browserlending",
  // common non-English subject noise that slips through as plain ASCII
  "meurtre", "policier", "roman ", "littérature", "ficção", "novela",
];
function cleanSubjects(subjects) {
  const out = [];
  for (const s of subjects || []) {
    if (typeof s !== "string") continue;
    const low = s.toLowerCase().trim();
    if (!low || low.length > 40) continue;
    if (low.includes(":") || low.includes(",")) continue;  // tag codes / catalog lists
    if (/[^\x00-\x7f]/.test(low)) continue;                 // accented / non-Latin (foreign)
    if (SUBJECT_STOP.some(w => low.includes(w))) continue;
    out.push(low);
  }
  return out;
}
function titleCase(s) {
  return s.replace(/\b\w/g, c => c.toUpperCase());
}

// One metadata pass over every past read powers the API-driven stats:
// page totals, reading time, page-based superlatives, a by-decade chart, and
// the genre tags. Page counts on Open Library are reliable; publish years are
// occasionally wrong, so the decade chart drops implausible years and we avoid
// single "oldest book" claims a lone bad value could hijack.
async function decorateStats() {
  if (!document.getElementById("stat-pages") && !document.getElementById("genre-tags")) return;
  const entries = state.history.filter(h => h.book);
  const metas = await Promise.all(entries.map(h => resolveBookMeta(h.book)));
  if (parseRoute().name !== "main") return; // navigated away while awaiting

  const nextYear = new Date().getFullYear() + 1;
  let totalPages = 0, pageCount = 0;
  let longest = null, shortest = null;
  const decades = {};
  const tally = {};

  entries.forEach((h, i) => {
    const m = metas[i] || {};
    if (m.pages) {
      totalPages += m.pages; pageCount++;
      if (!longest || m.pages > longest.pages) longest = { round: h.round, book: h.book, pages: m.pages };
      if (!shortest || m.pages < shortest.pages) shortest = { round: h.round, book: h.book, pages: m.pages };
    }
    if (Number.isFinite(m.year) && m.year >= 1850 && m.year <= nextYear) {
      const dec = Math.floor(m.year / 10) * 10;
      decades[dec] = (decades[dec] || 0) + 1;
    }
    const seen = new Set();
    cleanSubjects(m && m.subjects).forEach(s => {
      if (seen.has(s)) return; // count each subject once per book
      seen.add(s);
      tally[s] = (tally[s] || 0) + 1;
    });
  });

  const setNum = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const setHTML = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };

  // Number tiles
  setNum("stat-pages", totalPages ? totalPages.toLocaleString() : "—");
  setNum("stat-avg", pageCount ? Math.round(totalPages / pageCount).toLocaleString() : "—");
  // ~1.6 min/page for an average reader.
  setNum("stat-hours", totalPages ? Math.max(1, Math.round(totalPages * 1.6 / 60)).toLocaleString() : "—");

  // Superlatives (page-based — reliable)
  const supRow = (icon, label, item, val) => item
    ? `<div class="sup-row"><span class="sup-ico">${icon}</span><span class="sup-label">${label}</span>` +
      `<a class="book-link sup-title" href="#book=${item.round}">${esc(item.book)}</a><span class="sup-val">${esc(val)}</span></div>`
    : "";
  const sups = [
    supRow("📏", "Longest", longest, longest ? `${longest.pages.toLocaleString()} pp` : ""),
    supRow("🪶", "Shortest", shortest, shortest ? `${shortest.pages.toLocaleString()} pp` : ""),
  ].filter(Boolean).join("");
  setHTML("superlatives", sups || `<span class="genre-loading">No page data yet.</span>`);

  // Reads by decade
  const decadeKeys = Object.keys(decades).map(Number).sort((a, b) => a - b);
  if (decadeKeys.length) {
    const max = Math.max(...decadeKeys.map(d => decades[d]));
    setHTML("decade-chart", decadeKeys.map(d => {
      const c = decades[d];
      const pct = Math.max(6, Math.round((c / max) * 100));
      return `<div class="leader-row"><div class="lname decade-label">${d}s</div>` +
        `<div class="lbar"><span style="width:${pct}%;"></span></div><div class="lcount">${c}</div></div>`;
    }).join(""));
  } else {
    setHTML("decade-chart", `<span class="genre-loading">No publication dates yet.</span>`);
  }

  // Genres
  let ranked = Object.entries(tally).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const recurring = ranked.filter(([, c]) => c >= 2);
  ranked = (recurring.length >= 5 ? recurring : ranked).slice(0, 14);
  setHTML("genre-tags", ranked.length
    ? ranked.map(([s, c]) => `<a class="genre-tag genre-tag-link" href="#tag=${encodeURIComponent(s)}">${esc(titleCase(s))}<b>${c}</b></a>`).join("")
    : `<span class="genre-loading">Not enough shelf data yet.</span>`);
}

// Enrich every hero banner ("Next up" and any "Currently reading") with
// book-page details (author, a description blurb, and clickable subject tags),
// fetched via the rich detail lookup.
async function decorateBanners() {
  const banners = [...document.querySelectorAll(".winner-banner[data-banner-book]")];
  for (const el of banners) {
    const book = el.getAttribute("data-banner-book");
    if (!book || el.dataset.decorated) continue;
    el.dataset.decorated = "1";
    const detail = await resolveBookDetail(book);
    if (parseRoute().name !== "main") return; // navigated away
    const a = el.querySelector(".bn-author");
    const d = el.querySelector(".bn-desc");
    const t = el.querySelector(".bn-tags");
    if (a && detail.authors.length) a.textContent = `by ${detail.authors.join(", ")}`;
    if (d && detail.description) {
      let text = detail.description;
      if (text.length > 340) text = text.slice(0, 337).trimEnd() + "…";
      d.textContent = text;
    }
    if (t) {
      const subs = [...new Set(cleanSubjects(detail.subjects))].slice(0, 6);
      t.innerHTML = subs
        .map(s => `<a class="genre-tag genre-tag-link" href="#tag=${encodeURIComponent(s)}">${esc(titleCase(s))}</a>`)
        .join("");
    }
  }
}

// ---------- Book detail (for the per-book page) ----------
// A heavier, on-demand lookup (search + works endpoint) used only on the
// #book=<round> page — one book at a time, so cost is trivial.
const DETAIL_CACHE_KEY = "shelf-bookdetail-v3";
let bookDetailCache = {};
try { bookDetailCache = JSON.parse(localStorage.getItem(DETAIL_CACHE_KEY) || "{}") || {}; }
catch { bookDetailCache = {}; }
const pendingDetail = new Map();

async function fetchWorkDescription(key) {
  try {
    const res = await fetch(`https://openlibrary.org${key}.json`);
    if (!res.ok) return null;
    const w = await res.json();
    let d = w && w.description;
    if (d && typeof d === "object") d = d.value;
    if (typeof d !== "string") return null;
    d = d.replace(/\r/g, "");
    d = d.split(/\n\s*-{3,}\s*\n/)[0];              // drop trailing source block
    d = d.replace(/\(\[source\]\[\d+\]\)/gi, "");   // "([source][1])"
    d = d.replace(/^\s*\[\d+\]:\s*\S+.*$/gim, "");   // markdown link definitions
    d = d.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1"); // emphasis
    d = d.trim();
    return d || null;
  } catch { return null; }
}

// Open Library's id_* arrays can lead with blank entries ("" placeholders),
// so take the first non-empty value rather than blindly [0].
function firstId(arr) {
  if (!Array.isArray(arr)) return null;
  const v = arr.find(x => x != null && String(x).trim() !== "");
  return v != null ? String(v).trim() : null;
}

async function fetchBookDetail(rawTitle) {
  const { title, author } = parseTitleAuthor(rawTitle);
  const empty = {
    title: title || rawTitle, authors: [], year: null, pages: null,
    coverLarge: null, subjects: [], persons: [], places: [], publishers: [],
    languages: [], isbn: [], firstSentence: null, description: null,
    editionCount: null, olKey: null, goodreadsId: null, amazonId: null,
  };
  if (!title) return empty;
  const params = new URLSearchParams({
    title, limit: "5",
    fields: [
      "title", "author_name", "cover_i", "first_publish_year",
      "number_of_pages_median", "subject", "person", "place", "publisher",
      "language", "isbn", "first_sentence", "edition_count", "key",
      "id_goodreads", "id_amazon",
    ].join(","),
  });
  if (author) params.set("author", author);
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(`https://openlibrary.org/search.json?${params.toString()}`, { signal: ctrl.signal });
    if (!res.ok) return empty;
    const body = await res.json();
    const docs = body.docs || [];
    const normTitle = normalizeForMatch(title);
    let doc = null, coverId = null;
    for (const d of docs) {
      const resultNorm = normalizeForMatch(d.title || "");
      if (!resultNorm) continue;
      const matches = resultNorm === normTitle || resultNorm.includes(normTitle) || normTitle.includes(resultNorm);
      if (!matches) continue;
      if (!doc) doc = d;
      if (coverId === null && d.cover_i) coverId = d.cover_i;
      if (doc && coverId !== null) break;
    }
    if (!doc) return empty;
    const first = Array.isArray(doc.first_sentence) ? doc.first_sentence[0] : doc.first_sentence;
    const description = doc.key ? await fetchWorkDescription(doc.key) : null;
    return {
      title: doc.title || title,
      authors: Array.isArray(doc.author_name) ? doc.author_name : (author ? [author] : []),
      year: Number.isFinite(doc.first_publish_year) ? doc.first_publish_year : null,
      pages: Number.isFinite(doc.number_of_pages_median) ? doc.number_of_pages_median : null,
      coverLarge: coverId ? `https://covers.openlibrary.org/b/id/${coverId}-L.jpg` : null,
      subjects: Array.isArray(doc.subject) ? doc.subject : [],
      persons: Array.isArray(doc.person) ? doc.person.slice(0, 8) : [],
      places: Array.isArray(doc.place) ? doc.place.slice(0, 8) : [],
      publishers: Array.isArray(doc.publisher) ? doc.publisher.slice(0, 4) : [],
      languages: Array.isArray(doc.language) ? doc.language : [],
      isbn: Array.isArray(doc.isbn) ? doc.isbn.slice(0, 1) : [],
      firstSentence: typeof first === "string" ? first : null,
      description,
      editionCount: Number.isFinite(doc.edition_count) ? doc.edition_count : null,
      olKey: doc.key || null,
      goodreadsId: firstId(doc.id_goodreads),
      amazonId: firstId(doc.id_amazon),
    };
  } catch { return empty; }
  finally { clearTimeout(timer); }
}

async function resolveBookDetail(rawTitle) {
  const key = normalizeForMatch(rawTitle);
  if (!key) return fetchBookDetail(rawTitle);
  if (key in bookDetailCache) return bookDetailCache[key];
  if (pendingDetail.has(key)) return pendingDetail.get(key);
  const promise = enqueueMeta(() => fetchBookDetail(rawTitle)).then(detail => {
    if (detail && (detail.coverLarge || detail.year || detail.description || detail.subjects.length)) {
      bookDetailCache[key] = detail;
      try { localStorage.setItem(DETAIL_CACHE_KEY, JSON.stringify(bookDetailCache)); } catch {}
    }
    return detail;
  }).finally(() => { pendingDetail.delete(key); });
  pendingDetail.set(key, promise);
  return promise;
}

// ---------- Librarian mode ----------
// Librarian rights are a per-club role — `club_members.role = 'librarian'` for
// this club — not a shared password, and not the global shelf_librarians table
// (which would make a librarian of one club look like a librarian of every
// club). `amLibrarian` is set on sign-in and refreshed by every loadAll, and
// gates the Admin tab + controls. The server re-checks the same role on every
// admin-update call from the caller's JWT; this flag is only the UI gate.
let amLibrarian = false;
let librarianIds = new Set();       // all librarian user ids (for the Admin UI)
const isAdmin = () => amLibrarian;
const isLibrarianId = (id) => librarianIds.has(id);

async function callAdmin(action, payload = {}) {
  if (!session) { setFlash("err", "Sign in first."); return; }
  // Every admin action (except the wheel draw, which has its own "Choosing…"
  // button-state) funnels through here with no busy feedback at all, so a
  // fast double-click could fire the same action twice (double-undo,
  // double-lock-in). One guard at the choke point covers every call site.
  if (adminBusy) return;
  adminBusy = true;
  document.body.style.cursor = "wait";
  setRefreshing(true);
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-update`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ action, club_id: clubId(), payload }),
    });
    if (res.status === 401 || res.status === 403) {
      setFlash("err", "Not authorized — librarian only.");
      render();
      return;
    }
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      setFlash("err", `Admin action failed: ${t || res.statusText}`);
      return;
    }
    const body = await res.json();
    const prevRound = state.roundNumber;
    if (body.state) state = normalizeState(body.state);
    if (body.roundAdvanced && state.roundNumber > prevRound) {
      setFlash("info", `Round ${prevRound} closed. Round ${state.roundNumber} is open — everyone's back on the shelf.`);
    }
    render();
  } catch (err) {
    setFlash("err", friendlyError(err, "complete that action"));
  } finally {
    adminBusy = false;
    document.body.style.cursor = "";
    setRefreshing(false);
  }
}

// ---------- Modal helper ----------
// Shared dialog semantics for the three custom modals (reset-confirm, the
// rubric review wizard, the DNF modal): role=dialog/aria-modal, a Tab/Shift+Tab
// focus trap that re-queries focusable elements live (so it keeps working
// across the rubric wizard's repeated back.innerHTML rewrites between steps),
// Escape-to-close, and restoring focus to whatever triggered the modal when
// it closes. Each caller still owns its own markup/button wiring; this only
// creates the backdrop + attaches the shared behavior and hands back
// { back, close, focusFirst } for the caller to build on.
function openModal({ labelledBy } = {}) {
  const previouslyFocused = document.activeElement;
  const back = document.createElement("div");
  back.className = "modal-back";
  back.setAttribute("role", "dialog");
  back.setAttribute("aria-modal", "true");
  if (labelledBy) back.setAttribute("aria-labelledby", labelledBy);
  back.tabIndex = -1;

  function focusables() {
    return Array.from(back.querySelectorAll(
      'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )).filter(el => el.offsetParent !== null);
  }
  function focusFirst() {
    const f = focusables();
    (f[0] || back).focus();
  }
  function close() {
    if (!back.parentNode) return;
    document.body.removeChild(back);
    if (previouslyFocused && typeof previouslyFocused.focus === "function") previouslyFocused.focus();
  }
  back.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { close(); return; }
    if (e.key !== "Tab") return;
    const f = focusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  back.addEventListener("click", (e) => { if (e.target === back) close(); });
  document.body.appendChild(back);
  return { back, close, focusFirst };
}

// ---------- Generic modal dialogs ----------
// Themed stand-ins for confirm()/alert()/prompt(). The native dialogs are OS
// chrome dropped on top of a hand-styled dark theme -- jarring, and the one
// thing every reader sees before any destructive admin action. Built on
// openModal() so they share its focus trap, Escape-to-close and
// click-outside-to-close; each resolves its promise however the dialog closed
// rather than leaving a caller hanging.
function confirmModal(message, { title = "Are you sure?", confirmLabel = "Confirm", cancelLabel = "Cancel", danger = true } = {}) {
  return new Promise((resolve) => {
    const { back, close, focusFirst } = openModal({ labelledBy: "confirm-modal-title" });
    let settled = false;
    const finish = (v) => { if (settled) return; settled = true; close(); resolve(v); };
    back.innerHTML = `
      <div class="modal">
        <h3 id="confirm-modal-title">${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button class="btn-ghost" id="confirm-modal-cancel">${esc(cancelLabel)}</button>
          <button class="${danger ? 'btn-danger' : 'btn-primary'}" id="confirm-modal-go">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    focusFirst();
    back.querySelector("#confirm-modal-cancel").addEventListener("click", () => finish(false));
    back.querySelector("#confirm-modal-go").addEventListener("click", () => finish(true));
    back.addEventListener("keydown", (e) => { if (e.key === "Escape") finish(false); });
    back.addEventListener("click", (e) => { if (e.target === back) finish(false); });
  });
}
function alertModal(message, { title = "Heads up" } = {}) {
  return new Promise((resolve) => {
    const { back, close, focusFirst } = openModal({ labelledBy: "alert-modal-title" });
    let settled = false;
    const finish = () => { if (settled) return; settled = true; close(); resolve(); };
    back.innerHTML = `
      <div class="modal">
        <h3 id="alert-modal-title">${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="modal-actions">
          <button class="btn-primary" id="alert-modal-ok">OK</button>
        </div>
      </div>`;
    focusFirst();
    back.querySelector("#alert-modal-ok").addEventListener("click", finish);
    back.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") finish(); });
    back.addEventListener("click", (e) => { if (e.target === back) finish(); });
  });
}
// requireMatch mirrors the old RESET-style typed confirmation: Save stays
// disabled until the input matches it exactly.
function promptModal(message, { title = "Confirm", defaultValue = "", placeholder = "", confirmLabel = "Save", cancelLabel = "Cancel", requireMatch = null, danger = false } = {}) {
  return new Promise((resolve) => {
    const { back, close, focusFirst } = openModal({ labelledBy: "prompt-modal-title" });
    let settled = false;
    const finish = (v) => { if (settled) return; settled = true; close(); resolve(v); };
    back.innerHTML = `
      <div class="modal">
        <h3 id="prompt-modal-title">${esc(title)}</h3>
        <p>${esc(message)}</p>
        <input type="text" id="prompt-modal-input" autocomplete="off" placeholder="${attr(placeholder)}" value="${attr(defaultValue)}" />
        <div class="modal-actions">
          <button class="btn-ghost" id="prompt-modal-cancel">${esc(cancelLabel)}</button>
          <button class="${danger ? 'btn-danger' : 'btn-primary'}" id="prompt-modal-go"${requireMatch != null ? ' disabled' : ''}>${esc(confirmLabel)}</button>
        </div>
      </div>`;
    const input = back.querySelector("#prompt-modal-input");
    const goBtn = back.querySelector("#prompt-modal-go");
    focusFirst();
    input.select?.();
    const isValid = () => requireMatch == null || input.value.trim() === requireMatch;
    if (requireMatch != null) input.addEventListener("input", () => { goBtn.disabled = !isValid(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && isValid()) finish(input.value); });
    back.querySelector("#prompt-modal-cancel").addEventListener("click", () => finish(null));
    goBtn.addEventListener("click", () => { if (isValid()) finish(input.value); });
    back.addEventListener("keydown", (e) => { if (e.key === "Escape") finish(null); });
    back.addEventListener("click", (e) => { if (e.target === back) finish(null); });
  });
}

function promptResetConfirmation() {
  const { back, close, focusFirst } = openModal({ labelledBy: "reset-confirm-title" });
  back.innerHTML = `
    <div class="modal">
      <h3 id="reset-confirm-title">Really wipe everything?</h3>
      <p>This erases <b>every past read</b>, <b>every winner</b>, and drops the round counter back to <b>Round 1</b>. Every reader's "I want to read" book will also be cleared. There is no undo.</p>
      <p>Type <b>RESET</b> below to confirm.</p>
      <input type="text" id="reset-confirm-input" autocomplete="off" placeholder="Type RESET" />
      <div class="modal-actions">
        <button class="btn-ghost" id="reset-confirm-cancel">Cancel</button>
        <button class="btn-danger" id="reset-confirm-go" disabled>Wipe everything</button>
      </div>
    </div>
  `;
  const input = back.querySelector("#reset-confirm-input");
  const goBtn = back.querySelector("#reset-confirm-go");
  focusFirst();
  const isValid = () => input.value.trim() === "RESET";
  input.addEventListener("input", () => { goBtn.disabled = !isValid(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && isValid()) { close(); callAdmin("reset", {}); }
  });
  back.querySelector("#reset-confirm-cancel").addEventListener("click", close);
  goBtn.addEventListener("click", () => { close(); callAdmin("reset", {}); });
}

// ---------- Auth ----------
async function initAuth() {
  if (!CONFIGURED) { render(); return; }

  // A prompt=none attempt against a provider the account hasn't authorised (or has
  // since revoked) comes back as an error instead of a consent screen. Forget the
  // flag so the next click is an ordinary consent flow, and say so — silently
  // showing the sign-in page again would look like the button did nothing.
  if (INITIAL_OAUTH_ERROR) {
    forgetProvidersSeen();
    console.warn("OAuth error:", INITIAL_OAUTH_ERROR.code, INITIAL_OAUTH_ERROR.description);
    setFlash("err", "That sign-in didn't complete. Try again — you may be asked to approve access.");
  }

  const { data } = await supabase.auth.getSession();
  session = data?.session ?? null;
  if (session) {
    markProviderSeen(session.user?.app_metadata?.provider);
    await onSignedIn();
  } else render();

  supabase.auth.onAuthStateChange(async (event, s) => {
    session = s;
    if (event === "SIGNED_IN") {
      // Only now is it safe to skip the consent screen next time.
      markProviderSeen(s?.user?.app_metadata?.provider);
      await onSignedIn();
    }
    else if (event === "SIGNED_OUT") {
      users = []; myUserRow = null; state = emptyState(); amLibrarian = false; librarianIds = new Set();
      // Signing back in re-resolves to the same club, which resolveClubFromRoute
      // short-circuits -- so clear this here or the next reader gets a glimpse of
      // the previous one's shelf before their own load lands.
      clubDataLoaded = false;
      render();
    } else if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
      render();
    }
  });
}

async function onSignedIn() {
  // Before anything reads the route: put back the destination the OAuth round
  // trip stripped, so an invite link still lands on its invite.
  restorePostAuthDest();
  await ensureUserRow(session.user);
  // Which clubs are mine has to come first now: it decides both whether there's
  // anywhere to go at all, and (in resolveClubFromRoute) whether this reader may
  // see the club in the URL.
  await loadMyClubs();
  // Belongs to nothing and didn't ask for a particular club — the normal state of
  // a brand-new account since the auto-join was retired. Offer the two things
  // they can do rather than dropping them into someone else's book club.
  if (!myClubs.length && !parseRoute().clubSlug) { clubStatus = "no-clubs"; render(); return; }
  await resolveClubFromRoute();
  if (clubStatus !== "ok") { render(); return; }
  await loadLibrarianStatus();
  await loadAll();
  subscribeRealtime();
}

// Where to land after leaving or deleting your way out of a club.
function goAfterLeaving() {
  if (myClubs.length) { goToClub(myClubs[0].slug); return; }
  // Drop the club out of the URL so a reload doesn't put them back on a club
  // they just left. replaceState, so this doesn't fire a hashchange.
  try { history.replaceState(null, "", location.pathname + location.search); } catch { /* ignore */ }
  club = null;
  clubStatus = "no-clubs";
  render();
}

// ---------- Club lifecycle (Phase 4 slices 4c-4e) ----------
// Every action lives in the club-admin edge function, which owns the rules the
// client must not be trusted with: slug validation and reserved words, the
// creation rate limit, invite validity, and "the last librarian can't leave".
// This is a thin caller -- it never pre-judges any of those.
async function callClubAdmin(action, payload = {}) {
  if (!session) { setFlash("err", "Sign in first."); return null; }
  if (clubBusy) return null;
  clubBusy = true;
  document.body.style.cursor = "wait";
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/club-admin`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ action, ...payload }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { setFlash("err", body.error || res.statusText); return null; }
    return body;
  } catch (err) {
    setFlash("err", friendlyError(err, "complete that action"));
    return null;
  } finally {
    clubBusy = false;
    document.body.style.cursor = "";
  }
}

// Every club this reader is in, for the switcher and the "you're not in this
// club" page.
//
// The `user_id` filter is load-bearing, not belt-and-braces. club_members' select
// policy is `is_member(club_id) or clubs.visibility = 'public'` -- scoped by
// CLUB, not by user -- so an unfiltered read of a public club returns a row per
// member, and the switcher rendered one pill per member of The Guild (12 pills
// all reading "The Guild") instead of one per club. RLS restricts which clubs
// you can see; only this filter restricts them to the ones that are yours.
async function loadMyClubs() {
  if (!session) { myClubs = []; return; }
  try {
    const { data, error } = await supabase
      .from("club_members")
      .select("role, clubs:club_id ( id, slug, name, tagline, visibility, timezone )")
      .eq("user_id", session.user.id);
    if (error) throw error;
    // (club_id, user_id) is the primary key, so one row per club per reader --
    // dedupe by id anyway so a future join can't silently reintroduce the bug.
    const byId = new Map();
    for (const r of data || []) {
      if (r.clubs?.id) byId.set(r.clubs.id, { ...r.clubs, role: r.role });
    }
    myClubs = [...byId.values()].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  } catch (err) {
    console.warn("club list failed:", err.message);
    myClubs = [];
  }
}

// Invite codes for this club. RLS returns rows only to a librarian of it, so an
// empty list is the normal answer for everyone else -- no need to gate the call.
// The librarian-only bits of club_secrets, which no client can read directly.
// A non-librarian gets a 403 and leaves clubSettings null, which the Admin tab
// never renders for them anyway.
//
// Fetched once per club rather than on every loadAll: loadAll re-runs on every
// realtime change, and this is an edge-function round trip, not a table read.
// Switching clubs invalidates it because the cache is keyed by club id.
async function loadClubSettings({ force = false } = {}) {
  if (!club || !amLibrarian) { clubSettings = null; clubSettingsFor = null; return; }
  if (!force && clubSettingsFor === club.id && clubSettings) return;
  const body = await callClubAdmin("get_club_settings", { club_id: club.id });
  if (!body?.ok) return;   // leave whatever we had; a busy guard or blip isn't a reason to blank it
  clubSettings = { calendar_token: body.calendar_token, has_webhook: body.has_webhook };
  clubSettingsFor = club.id;
}

async function loadInvites() {
  if (!club) { invites = []; return; }
  try {
    const { data, error } = await supabase
      .from("club_invites")
      .select("code, uses, max_uses, expires_at, revoked, created_at")
      .eq("club_id", club.id)
      .order("created_at", { ascending: false });
    if (error) throw error;
    invites = data || [];
  } catch {
    invites = [];
  }
}

const inviteLink = (code) => `${location.origin}${location.pathname}#/join/${code}`;

// Clipboard, with the older fallback: navigator.clipboard needs a secure context
// and can be refused outright, and an invite you can't copy is useless.
async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch { return false; }
}

// An invite is spent when it's revoked, past its expiry, or out of uses -- the
// same three conditions club-admin checks at join time. Mirrored here only to
// label the list; the server decides.
function inviteState(i) {
  if (i.revoked) return { label: "revoked", dead: true };
  if (i.expires_at && new Date(i.expires_at).getTime() < Date.now()) return { label: "expired", dead: true };
  if (i.max_uses != null && i.uses >= i.max_uses) return { label: "used up", dead: true };
  if (i.max_uses != null) return { label: `${i.max_uses - i.uses} left`, dead: false };
  return { label: "unlimited", dead: false };
}

// Resolve the slug in #/c/<slug>/... to a real `clubs` row. A bare URL (or any
// of the older #book=/#reader=/... detail routes, which carry no slug) resolves
// the default club, so existing links keep working.
//
// Reads `clubs` directly: it's the one table whose select policy is still
// unscoped `using (true)`, precisely so a reader can discover the club they were
// pointed at before anyone knows whether they're a member of it. A private club
// a stranger isn't in resolves fine here and then yields empty club-scoped
// queries under RLS -- which is Phase 4's job to turn into a real "ask for an
// invite" page rather than an empty shelf.
async function resolveClubFromRoute() {
  const wanted = parseRoute().clubSlug || DEFAULT_CLUB_SLUG;
  if (club && club.slug === wanted && clubStatus === "ok") return;
  clubStatus = "loading";
  // A different club from here on: the loaded rows belong to the old one.
  clubDataLoaded = false;
  try {
    const { data, error } = await supabase
      .from("clubs").select("id, slug, name, tagline, visibility, timezone, suspended_at, config, discord_guild_id").eq("slug", wanted).maybeSingle();
    if (error) throw error;
    if (!data) { club = null; clubStatus = "not_found"; return; }
    club = data;
    // A moderation hold (set by hand, no UI -- see the migration) takes
    // priority over membership: a suspended club's own members shouldn't see
    // a working-looking app whose every write silently 403s.
    if (data.suspended_at) { clubStatus = "suspended"; return; }
    // Membership decides whether there's anything to show, for EVERY club
    // including the seeded one. That used to be short-circuited on the grounds
    // that sign-in auto-joined the seeded club — retiring the auto-join
    // (20260809170000) removed the premise, and leaving the short-circuit would
    // have shown a stranger the club's full app with no way to take part in it.
    // The server enforces the same check on every write; this is the UI half of
    // one rule, not the rule itself.
    //
    // Narrowing worth naming: a `public` club is now viewable only by its
    // members, even though RLS would allow anyone to read it. Spectating a public
    // club is a real feature but not one that exists — and the signed-out gate
    // already meant nobody could do it in practice.
    const { data: mine } = await supabase
      .from("club_members").select("user_id")
      .eq("club_id", data.id).eq("user_id", session.user.id).maybeSingle();
    clubStatus = mine ? "ok" : "not_member";
  } catch (err) {
    console.warn("club resolve failed:", err.message);
    // Fall back to the default club rather than locking the app out on a blip.
    club = { id: DEFAULT_CLUB_ID, slug: DEFAULT_CLUB_SLUG, name: "The Shelf", visibility: "public", timezone: DEFAULT_CLUB_TZ };
    clubStatus = "ok";
  }
}

// Signing in no longer joins you to anything.
//
// This is where ensureClubMembership() used to call join_default_club(), adding
// every new account to the seeded club. That made sense when there was one club
// and signing in meant landing on it; once anyone can sign up and create their
// own, it made every stranger a member of somebody else's book club — on its
// shelf and in its wheel. The RPC is dropped in 20260809170000; getting into a
// club is an invite (Phase 4d) or creating one (4c). A reader who has neither
// lands on renderNoClubs().

// Load who the librarians are, from club_members.role scoped to this club —
// *not* the global shelf_librarians table, which would have shown the Admin tab
// to a librarian of some other club (the server has enforced the club-scoped
// role since Phase 2, so the UI was the half that could lie). `amLibrarian`
// drives the tab gate; `librarianIds` powers the grant/revoke controls. The
// server independently re-checks the caller's JWT on every admin-update call.
async function loadLibrarianStatus() {
  try {
    const { data } = await supabase
      .from("club_members")
      .select("user_id")
      .eq("club_id", clubId())
      .eq("role", "librarian");
    librarianIds = new Set((data || []).map(r => r.user_id));
  } catch {
    librarianIds = new Set();
  }
  amLibrarian = !!(session && librarianIds.has(session.user.id));
}

// ---------- Identity, per provider (Phase 5 prep) ----------
// Each provider nests name and avatar differently, and an email signup has no
// metadata at all. The existing Discord chain is preserved exactly, in order, so
// no current reader's display name changes -- the new sources are only ever
// consulted after it runs out.
function displayNameFromMeta(user) {
  const m = user.user_metadata || {};
  const c = m.custom_claims || {};
  return c.global_name          // Discord
    || m.full_name              // Discord, Google
    || m.preferred_username     // Discord
    || m.name                   // Google
    || nameFromEmail(user.email)
    || "Reader";
}

// Email accounts arrive with nothing to borrow, so the local part is the only
// name available until the reader is asked for one (slice 5b). Drops any +tag and
// tidies separators so "ada.lovelace+books@x.com" reads as "ada lovelace".
function nameFromEmail(email) {
  const local = String(email || "").split("@")[0].split("+")[0];
  if (!local) return null;
  const cleaned = local.replace(/[._-]+/g, " ").trim().slice(0, 40);
  return cleaned || null;
}

function avatarFromMeta(user) {
  const m = user.user_metadata || {};
  return m.avatar_url           // Discord
    || m.picture                // Google
    || null;
}

// The Discord user id, and ONLY ever a Discord one.
//
// This used to fall back to user_metadata.provider_id / .sub, which are whatever
// the most recent provider wrote -- so signing in with Google would have written a
// GOOGLE subject id into shelf_users.discord_id. That column is what
// discord-interactions looks readers up by for /mybook, and profiles.discord_id is
// unique, so the damage ranged from an inert wrong value to overwriting a real
// Discord id (breaking that reader's slash command) to a unique-violation on
// sign-in. `identities` is the authoritative list and is per provider; metadata is
// only trusted when Discord is demonstrably the only provider on the account.
function discordIdFromUser(user) {
  const identity = user.identities?.find(i => i.provider === "discord");
  if (identity) return identity.id || identity.identity_data?.provider_id || null;
  if ((user.app_metadata?.provider || "") === "discord") {
    return user.user_metadata?.provider_id || user.user_metadata?.sub || null;
  }
  return null;
}

async function ensureUserRow(user) {
  const fromProvider = displayNameFromMeta(user);
  const avatar = avatarFromMeta(user);
  const discordId = discordIdFromUser(user);

  // Has this reader chosen their own name? If so, sign-in must leave it alone --
  // this write runs on every single sign-in, and overwriting from provider metadata
  // is exactly what made a chosen name silently revert (Phase 6b). Avatar and
  // discord_id keep tracking the provider either way; only the name is claimable.
  let customised = false;
  try {
    const { data: prof } = await supabase
      .from("profiles").select("display_name, display_name_customised").eq("id", user.id).maybeSingle();
    if (prof?.display_name_customised && (prof.display_name || "").trim()) {
      customised = true;
      myDisplayName = prof.display_name;
    }
  } catch (err) {
    console.warn("profile name check failed:", err?.message);
  }
  const username = customised ? myDisplayName : fromProvider;
  myNameCustomised = customised;

  const { data, error } = await supabase
    .from("shelf_users")
    .upsert({
      id: user.id,
      discord_username: username,
      avatar_url: avatar,
      discord_id: discordId,
    }, { onConflict: "id" })
    .select().single();
  if (error) { setFlash("err", friendlyError(error, "finish signing you in")); return; }
  myUserRow = data;
  myDisplayName = data.discord_username;

  // `profiles` is the provider-agnostic identity row. Kept live here; the flag is
  // never written by this path, only read -- setting it is a deliberate act on the
  // account page. Nothing reads `profiles` for display yet (that cutover would mean
  // touching the draw path and Discord embeds too), so a failure isn't worth
  // interrupting sign-in over.
  try {
    const { error: pErr } = await supabase
      .from("profiles")
      .upsert({
        id: user.id,
        display_name: username,
        avatar_url: avatar,
        discord_id: discordId,
      }, { onConflict: "id" });
    if (pErr) console.warn("profiles sync failed:", pErr.message);
  } catch (err) {
    console.warn("profiles sync error:", err);
  }
}

// Set (or release) this reader's chosen display name.
//
// Written straight from the browser rather than through an edge function: both rows
// are the caller's own and RLS already restricts them to their owner, there's no
// secret involved and no effect on anyone else. Length is enforced by CHECK
// constraints on both columns, so the DB holds the line even though the client
// validates first for the error message.
//
// Both tables, deliberately: `shelf_users.discord_username` is still what the app
// reads and what admin-update puts in Discord embeds, so writing only `profiles`
// would show a chosen name on the account page and the provider's name everywhere
// that matters.
async function saveDisplayName(name) {
  const trimmed = (name || "").trim().slice(0, 40);
  if (!trimmed) { setFlash("err", "A display name can't be empty."); render(); return; }
  try {
    const { error: pErr } = await supabase
      .from("profiles")
      .update({ display_name: trimmed, display_name_customised: true })
      .eq("id", session.user.id);
    if (pErr) throw pErr;
    const { error: uErr } = await supabase
      .from("shelf_users")
      .update({ discord_username: trimmed })
      .eq("id", session.user.id);
    if (uErr) throw uErr;
    myDisplayName = trimmed;
    myNameCustomised = true;
    setFlash("info", `You're now “${trimmed}”.`);
    await loadAll();       // renders; refreshes the name everywhere it appears
  } catch (err) {
    setFlash("err", friendlyError(err, "save your name"));
    render();
  }
}

// Hand the name back to the identity provider: clears the flag so the next sign-in
// resumes tracking it, and applies the provider's current name right away.
async function resetDisplayName() {
  const fromProvider = displayNameFromMeta(session.user);
  try {
    const { error: pErr } = await supabase
      .from("profiles")
      .update({ display_name: fromProvider, display_name_customised: false })
      .eq("id", session.user.id);
    if (pErr) throw pErr;
    const { error: uErr } = await supabase
      .from("shelf_users")
      .update({ discord_username: fromProvider })
      .eq("id", session.user.id);
    if (uErr) throw uErr;
    myDisplayName = fromProvider;
    myNameCustomised = false;
    setFlash("info", `Back to “${fromProvider}”.`);
    await loadAll();
  } catch (err) {
    setFlash("err", friendlyError(err, "reset your name"));
    render();
  }
}

// Where the reader was heading before they were asked to sign in.
//
// `redirectTo` below deliberately strips the hash, and has to: OAuth comes back
// with Supabase's own token fragment in the URL, which would collide with ours.
// That meant a signed-out person clicking an invite link lost the code across the
// round trip and landed on the default club instead of the club that invited them
// — the primary path for every new member. So the destination is stashed here and
// restored after sign-in.
//
// sessionStorage, not localStorage: it survives navigating this tab out to
// Discord and back, but doesn't leak a half-finished journey into other tabs or
// outlive the browser session. Phase 5's email confirmation adds a second round
// trip (through the inbox, possibly in a different tab) that this will NOT
// survive — that one needs the destination carried in the confirmation link.
const POST_AUTH_KEY = "shelf:post-auth-dest";
const POST_AUTH_ROUTES = /^#\/(?:join\/[A-Za-z0-9]+|new|c\/[^/]+(?:\/[a-z]*)?)\/?$/;

function stashPostAuthDest() {
  const h = location.hash || "";
  if (!POST_AUTH_ROUTES.test(h)) return;
  try { sessionStorage.setItem(POST_AUTH_KEY, h); } catch { /* private mode; not fatal */ }
}

function restorePostAuthDest() {
  let h = null;
  try {
    h = sessionStorage.getItem(POST_AUTH_KEY);
    if (h) sessionStorage.removeItem(POST_AUTH_KEY);
  } catch { /* ignore */ }
  if (!h || location.hash === h) return;
  // replaceState rather than assigning location.hash: assigning fires a
  // hashchange, and onSignedIn is already about to resolve and load this exact
  // route — the two would race and double-load.
  try { history.replaceState(null, "", location.pathname + location.search + h); } catch { location.hash = h; }
}

// Ways in, in the order they appear on the gate.
//
// `enabled` is a deploy-time switch, not feature detection: there's no way to ask
// Supabase whether a provider is configured, and a button that looks live and then
// errors is worse than one that isn't there. Enabling Google is two dashboard steps
// (Google Cloud OAuth credentials with
// https://<project-ref>.supabase.co/auth/v1/callback as the redirect URI, then
// Authentication → Providers → Google) plus flipping this flag.
//
// Before enabling a second provider, settle same-email identity linking in
// Authentication → Settings. With linking on, an existing reader who signs in with
// Google on the same address keeps their account. With it off they get a brand-new
// one — empty shelf, no clubs, and their picks and reviews still attached to an
// account they can't reach. That's slice 5d arriving early, and it's the only part
// of "just add Google" that isn't trivial.
const AUTH_PROVIDERS = [
  { id: "discord", label: "Continue with Discord", enabled: true },
  { id: "google", label: "Continue with Google", enabled: true },
];

const PROVIDER_ICONS = {
  discord: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.492c-1.53-.69-3.17-1.2-4.885-1.49a.075.075 0 0 0-.079.036c-.21.369-.444.85-.608 1.23a18.566 18.566 0 0 0-5.487 0 12.36 12.36 0 0 0-.617-1.23A.077.077 0 0 0 8.562 3c-1.714.29-3.354.8-4.885 1.49a.07.07 0 0 0-.032.027C.533 9.093-.32 13.555.099 17.961a.08.08 0 0 0 .031.055 20.03 20.03 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.963 19.963 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.094-.838-9.52-3.549-13.442a.061.061 0 0 0-.031-.028zM8.02 15.278c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>`,
  google: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.06-1.36-.18-2H12v3.79h5.36a4.6 4.6 0 0 1-2 3.02v2.5h3.22c1.88-1.73 2.97-4.29 2.97-7.31z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.43l-3.22-2.5c-.9.6-2.04.95-3.39.95a5.94 5.94 0 0 1-5.58-4.1H3.06v2.59A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.42 13.92a6 6 0 0 1 0-3.84V7.49H3.06a10 10 0 0 0 0 9.02l3.36-2.59z"/><path fill="#EA4335" d="M12 6.06c1.47 0 2.79.5 3.83 1.5l2.86-2.86A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.94 5.49l3.36 2.59A5.94 5.94 0 0 1 12 6.06z"/></svg>`,
};

// Has this browser completed a sign-in with this provider before?
//
// Discord's `prompt` parameter defaults to **consent**, so its authorise screen
// reappears on every single sign-in even when the account granted access long ago.
// `prompt=none` skips it — but it *errors* rather than prompting when the account
// hasn't authorised the app yet, so it can't be sent unconditionally.
//
// So: send it only once we've seen a successful sign-in with that provider in this
// browser. First sign-in (and any new browser) gets the normal consent screen,
// which is correct — it's the one time you genuinely are granting something.
// Revoking access in Discord makes the flag stale; that lands as an OAuth error on
// return, which clears the flag so the next attempt is an ordinary consent flow.
const providerSeenKey = (p) => `shelf:oauth-seen:${p}`;

function markProviderSeen(provider) {
  if (!provider) return;
  try { localStorage.setItem(providerSeenKey(provider), "1"); } catch { /* private mode */ }
}

function providerSeen(provider) {
  try { return localStorage.getItem(providerSeenKey(provider)) === "1"; } catch { return false; }
}

function forgetProvidersSeen() {
  for (const p of AUTH_PROVIDERS) {
    try { localStorage.removeItem(providerSeenKey(p.id)); } catch { /* ignore */ }
  }
}

async function signIn(provider = "discord") {
  if (!CONFIGURED) return;
  const known = AUTH_PROVIDERS.find(p => p.id === provider && p.enabled);
  if (!known) { setFlash("err", "That sign-in method isn't available."); render(); return; }
  stashPostAuthDest();
  const cleanUrl = window.location.href.split("#")[0].split("?")[0];
  // The error was previously ignored, so a provider that isn't configured in the
  // dashboard failed silently — the button simply did nothing.
  const { error } = await supabase.auth.signInWithOAuth({
    provider,
    options: {
      redirectTo: cleanUrl,
      ...(providerSeen(provider) ? { queryParams: { prompt: "none" } } : {}),
    },
  });
  if (error) {
    console.warn("sign-in failed:", error.message);
    setFlash("err", /provider is not enabled|unsupported/i.test(error.message)
      ? `${provider} sign-in isn't set up yet.`
      : friendlyError(error, "start sign-in"));
    render();
  }
}

async function signOut() {
  await supabase.auth.signOut();
}

// ---------- Data loading ----------
function setRefreshing(on) {
  document.getElementById("refresh-bar")?.classList.toggle("active", on);
}
async function loadAll() {
  if (!CONFIGURED) { render(); return; }
  // Never query club-scoped tables before the club is settled -- clubId() would
  // fall back to the default and load the wrong club's rows.
  if (clubStatus !== "ok") { render(); return; }
  setRefreshing(true);
  try {
    const [{ data: sData, error: sErr }, { data: mData, error: mErr }, { data: rData, error: rErr }, { data: cData, error: cErr }, { data: readsData, error: readsErr }, { data: xData, error: xErr }, { data: npData, error: npErr }] = await Promise.all([
      // Keyed by club_id, not the old fixed `id = 1` singleton.
      supabase.from("shelf_state").select("data").eq("club_id", clubId()).single(),
      // Membership + book + role for this club. Replaces the unscoped
      // `shelf_users.select("*")`, which pulled every reader of every club.
      supabase.from("club_members").select("user_id, role, book, joined_at, last_seen_at").eq("club_id", clubId()),
      supabase.from("shelf_reviews").select("*").eq("club_id", clubId()),
      supabase.from("shelf_comments").select("*").eq("club_id", clubId()),
      supabase.from("reads")
        .select("round, winner_id, winner_username, book, ts, rating, ratingsOpen:ratings_open, meetings")
        .eq("club_id", clubId())
        .order("ts", { ascending: false }),
      supabase.from("shelf_comment_reactions").select("comment_id, user_id, emoji").eq("club_id", clubId()),
      // Phase 11 §4.4: this reader's own row only, RLS-restricted. No row yet
      // means the defaults (mention on) apply.
      supabase.from("notification_prefs").select("mention_winner").eq("club_id", clubId()).eq("user_id", session.user.id).maybeSingle(),
    ]);
    if (npErr) console.warn("notification_prefs unavailable:", npErr.message);
    myNotificationPrefs = npErr ? null : (npData || { mention_winner: true });
    if (sErr && sErr.code !== "PGRST116") throw sErr;
    if (mErr) throw mErr;
    // History lives in `reads` (Phase 0 cutover), not shelf_state.data.history
    // — eliminated/roundNumber still come from shelf_state. Degrade to an
    // empty history rather than breaking the whole load if it's unavailable.
    if (readsErr) console.warn("reads unavailable:", readsErr.message);
    state = normalizeState({
      eliminated: sData?.data?.eliminated,
      roundNumber: sData?.data?.roundNumber,
      rotationCursor: sData?.data?.rotationCursor,
      history: (!readsErr && readsData) ? readsData : [],
    });
    // `users` is this club's membership joined with each member's identity:
    // club_members carries who's in the club, their role, and their book;
    // shelf_users carries the display name and avatar and is global (no
    // club_id), so it's fetched by id rather than swept. Same row shape render()
    // has always consumed — anyone without an identity row is skipped, since
    // there'd be nothing to draw.
    const members = mData || [];
    const memberIds = members.map(m => m.user_id);
    let identities = [];
    if (memberIds.length) {
      const { data: iData, error: iErr } = await supabase
        .from("shelf_users")
        .select("id, discord_username, avatar_url, discord_id")
        .in("id", memberIds);
      if (iErr) throw iErr;
      identities = iData || [];
    }
    const identityById = new Map(identities.map(u => [u.id, u]));
    users = members
      .filter(m => identityById.has(m.user_id))
      .map(m => ({ ...identityById.get(m.user_id), book: m.book, role: m.role, joined_at: m.joined_at, last_seen_at: m.last_seen_at }));
    // Roles come from the same fetch, so the Admin gate can't drift from the
    // membership list the rest of the UI is rendering.
    librarianIds = new Set(members.filter(m => m.role === "librarian").map(m => m.user_id));
    amLibrarian = !!(session && librarianIds.has(session.user.id));
    // Reviews/comments are non-critical: if a table isn't there yet (migration
    // not applied), degrade to empty instead of breaking the whole load.
    if (rErr) console.warn("shelf_reviews unavailable:", rErr.message);
    reviews = (!rErr && rData) ? rData : [];
    if (cErr) console.warn("shelf_comments unavailable:", cErr.message);
    comments = (!cErr && cData) ? cData : [];
    if (xErr) console.warn("shelf_comment_reactions unavailable:", xErr.message);
    reactions = (!xErr && xData) ? xData : [];
    // Club switcher + invite list. Non-critical: a failure here degrades the
    // Phase 4 chrome, it doesn't stop the shelf from rendering.
    await Promise.all([loadMyClubs(), loadInvites(), loadClubSettings()]);
    if (session) myUserRow = users.find(u => u.id === session.user.id) || myUserRow;
    markClubSeen();
  } catch (err) {
    // A load can land mid-token-rotation and fail on the access token rather than
    // on anything being wrong -- most visibly right after linking a second
    // identity, where the session is reissued while requests are in flight.
    // Refresh the session and try once more before saying anything: the previous
    // behaviour flashed "Couldn't load: JWT expired" at a reader whose next
    // refresh would have succeeded anyway.
    const authish = /jwt|token|401|unauthor/i.test(err?.message || "");
    console.warn("loadAll failed:", err?.message, authish ? "(auth-shaped; retrying once)" : "");
    if (authish && !loadAllRetrying) {
      loadAllRetrying = true;
      try {
        await supabase.auth.refreshSession();
        await loadAll();          // renders on its way out
        return;
      } catch (retryErr) {
        console.warn("loadAll retry failed:", retryErr?.message);
      } finally {
        loadAllRetrying = false;
      }
    }
    setFlash("err", friendlyError(err, "load the shelf"));
  }
  setRefreshing(false);
  // Set on the way out of the failure path too: a load that errored has an error
  // flash to show, and holding the boot placeholder forever would hide it.
  clubDataLoaded = true;
  render();
}

function subscribeRealtime() {
  if (!CONFIGURED) return;
  const clubFilter = `club_id=eq.${clubId()}`;
  supabase.channel("shelf-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "shelf_state", filter: clubFilter }, () => queueRefresh())
    .on("postgres_changes", { event: "*", schema: "public", table: "club_members", filter: clubFilter }, () => queueRefresh())
    // shelf_users is global identity (no club_id, so nothing to filter on) and
    // only changes when someone's display name or avatar does — rare enough that
    // the cross-club wakeups it causes aren't worth losing live avatar updates.
    // Everything that used to arrive via this channel (books, joins, roles) now
    // comes through club_members above.
    .on("postgres_changes", { event: "*", schema: "public", table: "shelf_users" }, () => queueRefresh())
    .on("postgres_changes", { event: "*", schema: "public", table: "shelf_reviews", filter: clubFilter }, () => queueRefresh())
    .on("postgres_changes", { event: "*", schema: "public", table: "shelf_comments", filter: clubFilter }, () => queueRefresh())
    .on("postgres_changes", { event: "*", schema: "public", table: "shelf_comment_reactions", filter: clubFilter }, () => queueRefresh())
    .on("postgres_changes", { event: "*", schema: "public", table: "reads", filter: clubFilter }, () => queueRefresh())
    .subscribe();
}
let refreshTimer = null;
function queueRefresh() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; loadAll(); }, 300);
}

// ---------- Reader actions ----------
async function setMyBook(book) {
  if (!session) return;
  book = (book || "").trim();
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/set-book`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ book, club_id: clubId() }),
    });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error(t || res.statusText);
    }
    const body = await res.json();
    myUserRow = body.user;
    const idx = users.findIndex(u => u.id === body.user.id);
    if (idx >= 0) users[idx] = body.user; else users.push(body.user);
    setFlash("info", book ? `Your pick: "${book}".` : "Cleared your book.");
    render();
  } catch (err) {
    setFlash("err", friendlyError(err, "save your book"));
  }
}

// ---------- Member reviews ----------
// Post (or clear, when scores is null) the signed-in reader's rubric review for
// a read, then refresh the local cache and re-render. Pass scores === "dnf" to
// mark the read as didn't-finish instead of scoring it.
async function saveMyReview(bookTs, scores, note) {
  if (!session || !bookTs) return;
  const dnf = scores === "dnf";
  const payload = scores === null
    ? { book_ts: bookTs, clear: true }
    : dnf
      ? { book_ts: bookTs, dnf: true, note: note || "" }
      : { book_ts: bookTs, ...scores, note: note || "" };
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/set-review`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ ...payload, club_id: clubId() }),
    });
    if (!res.ok) {
      const t = await res.text().catch(() => "");
      throw new Error(t || res.statusText);
    }
    const body = await res.json();
    reviews = reviews.filter(r => !(r.book_ts === bookTs && r.user_id === session.user.id));
    if (body.review) reviews.push(body.review);
    setFlash("info", scores === null ? "Cleared your review." : dnf ? "Marked as didn't-finish." : "Your review is in.");
    render();
  } catch (err) {
    setFlash("err", friendlyError(err, "save your review"));
  }
}

// ---------- Discussion threads ----------
// Threading is single-level: commentsFor gives top-level comments, repliesFor
// gives a top-level comment's replies. Replies never have replies of their own.
function commentsFor(bookTs) {
  return comments
    .filter(c => c.book_ts === bookTs && !c.parent_id)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}
function repliesFor(commentId) {
  return comments
    .filter(c => c.parent_id === commentId)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}
// Which top-level comment currently has its reply box open (only one at a time).
let replyingTo = null;
async function postComment(bookTs, text, parentId = null) {
  text = (text || "").trim();
  if (!session || !bookTs || !text) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/post-comment`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${session.access_token}` },
      body: JSON.stringify({ book_ts: bookTs, body: text, parent_id: parentId, club_id: clubId() }),
    });
    if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(t || res.statusText); }
    const body = await res.json();
    if (body.comment) comments.push(body.comment);
    render();
  } catch (err) { setFlash("err", friendlyError(err, "post that")); render(); }
}
async function deleteComment(id) {
  if (!session || !id) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/post-comment`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${session.access_token}` },
      body: JSON.stringify({ delete_id: id, club_id: clubId() }),
    });
    if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(t || res.statusText); }
    // The DB cascade-deletes any replies too (parent_id -> on delete cascade);
    // mirror that locally so orphaned replies don't linger until next refresh.
    comments = comments.filter(c => c.id !== id && c.parent_id !== id);
    render();
  } catch (err) { setFlash("err", friendlyError(err, "delete that comment")); render(); }
}

// ---------- Comment reactions ----------
// Reactions are low-stakes and carry no service-role logic, so (unlike comments)
// they're written straight to the table under RLS (insert/delete your own row).
const REACTION_EMOJI = ["👍", "❤️", "😂", "😮", "😢", "🔥"];
function reactionsFor(commentId) {
  return (reactions || []).filter(r => r.comment_id === commentId);
}
// Group a comment's reactions into { emoji, count, mine }, most-used first.
function reactionSummary(commentId) {
  const myId = session?.user?.id;
  const map = new Map();
  for (const r of reactionsFor(commentId)) {
    const e = map.get(r.emoji) || { emoji: r.emoji, count: 0, mine: false };
    e.count++; if (myId && r.user_id === myId) e.mine = true;
    map.set(r.emoji, e);
  }
  return [...map.values()].sort((a, b) => b.count - a.count);
}
async function reactComment(commentId, emoji) {
  if (!session || !commentId || !emoji) return;
  document.activeElement?.blur?.();
  const myId = session.user.id;
  const has = reactions.some(r => r.comment_id === commentId && r.user_id === myId && r.emoji === emoji);
  try {
    if (has) {
      const { error } = await supabase.from("shelf_comment_reactions").delete()
        .match({ comment_id: commentId, user_id: myId, emoji });
      if (error) throw error;
      reactions = reactions.filter(r => !(r.comment_id === commentId && r.user_id === myId && r.emoji === emoji));
    } else {
      const { error } = await supabase.from("shelf_comment_reactions")
        .insert({ comment_id: commentId, user_id: myId, emoji });
      if (error) throw error;
      reactions.push({ comment_id: commentId, user_id: myId, emoji });
    }
    render();
  } catch (err) { setFlash("err", friendlyError(err, "react to that")); render(); }
}

// Librarian opens or closes member reviews for a read.
function setRatingsOpen(bookTs, open) {
  callAdmin("admin_set_ratings_open", { ts: bookTs, open: !!open });
}

// Librarian snapshots the current member average into the committed score,
// which drops the read onto the leaderboard (and promotes the next-up read).
async function lockInScore(bookTs) {
  const agg = aggregateRubric(bookTs);
  if (!agg) { setFlash("err", "No member reviews to lock in yet."); render(); return; }
  const h = state.history.find(x => x.ts === bookTs);
  const title = h?.book || "this read";
  const ok = await confirmModal(
    `Lock in the ${scoreLabel()} for "${title}" at ${agg.total}/100 (${agg.band.label}), averaged from ${agg.count} review${agg.count === 1 ? '' : 's'}? It moves to the leaderboard.`,
    { title: "Lock in this score?", confirmLabel: "Lock in", danger: false },
  );
  if (!ok) return;
  const cats = {};
  for (const { key } of RUBRIC) cats[key] = Math.round(agg.cats[key]);
  callAdmin("admin_set_rating", { ts: bookTs, total: agg.total, ...cats, reviews: agg.count });
}

// Review wizard: one rubric category per page (so the club can score them one
// at a time on the call), each showing the four band descriptions, then a final
// summary + note page. Values default to the reader's prior review, or 60% of
// the club's scale (12 at the default scale 20 -- unchanged).
function bandKeyOf(v) {
  for (const t of ratingBandTiers(RATING_SCALE)) { if (v >= t.min) return t.band; }
  return "bad";
}

function openRubricModal(bookTs, bookTitle) {
  const mine = myReviewFor(bookTs);
  const defaultVal = Math.round(RATING_SCALE * 0.6);
  const vals = {};
  RUBRIC.forEach(({ key }) => { vals[key] = (mine && !mine.dnf && Number.isFinite(Number(mine[key]))) ? Number(mine[key]) : defaultVal; });
  let note = mine?.note || "";
  let step = 0; // 0..4 = categories, then the summary page

  const { back, close } = openModal({ labelledBy: "rub-heading" });

  const title = esc(bookTitle || "this read");

  function renderCategory() {
    const { key, label, bands } = RUBRIC[step];
    const v = vals[key];
    const activeKey = bandKeyOf(v);
    back.innerHTML = `
      <div class="modal rubric-modal">
        <div class="rubric-progress">
          <span class="rubric-step-label" id="rub-heading" tabindex="-1">${esc(label)}</span>
          <span class="rubric-step-count">${step + 1} of ${RUBRIC.length}</span>
        </div>
        <div class="rubric-dots">${RUBRIC.map((_, i) => `<span class="${i === step ? 'on' : (i < step ? 'done' : '')}"></span>`).join("")}</div>
        <p class="rubric-sub">Scoring <b>${title}</b> — tap the band you agree on, then fine-tune.</p>
        <div class="band-cards">
          ${ratingBandTiers(RATING_SCALE).map(b => `
            <button type="button" class="band-card ${b.cls} ${b.band === activeKey ? 'active' : ''}" data-band="${b.band}" data-mid="${b.mid}">
              <span class="band-card-head"><b>${b.label}</b><span class="band-range">${b.range}</span></span>
              <span class="band-desc">${esc(bands[b.band])}</span>
            </button>`).join("")}
        </div>
        <div class="rubric-slider">
          <input type="range" min="1" max="${RATING_SCALE}" step="1" value="${v}" id="rub-slider">
          <span class="rubric-val" id="rub-slval">${v}</span>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" id="rub-back">${step === 0 ? 'Cancel' : 'Back'}</button>
          <button class="btn-primary" id="rub-next">${step === RUBRIC.length - 1 ? 'Review & submit' : 'Next →'}</button>
        </div>
      </div>`;
    const slider = back.querySelector("#rub-slider");
    const slval = back.querySelector("#rub-slval");
    const refreshActive = () => {
      const ak = bandKeyOf(Number(slider.value));
      back.querySelectorAll(".band-card").forEach(c => c.classList.toggle("active", c.dataset.band === ak));
    };
    slider.addEventListener("input", () => { vals[key] = Number(slider.value); slval.textContent = slider.value; refreshActive(); });
    back.querySelectorAll(".band-card").forEach(c => c.addEventListener("click", () => {
      vals[key] = Number(c.dataset.mid); slider.value = vals[key]; slval.textContent = vals[key]; refreshActive();
    }));
    back.querySelector("#rub-back").addEventListener("click", () => { if (step === 0) close(); else { step--; renderStep(); } });
    back.querySelector("#rub-next").addEventListener("click", () => { step++; renderStep(); });
    back.querySelector("#rub-heading").focus();
  }

  function renderSummary() {
    const total = normalizeTotal(RUBRIC.map(({ key }) => vals[key]), RATING_SCALE);
    const band = ratingBand(total);
    back.innerHTML = `
      <div class="modal rubric-modal">
        <h3 id="rub-heading" tabindex="-1">Your review</h3>
        <p class="rubric-sub"><b>${title}</b></p>
        <div class="rubric-summary">
          ${RUBRIC.map(({ key, label }, i) => {
            const b = categoryBand(vals[key]);
            return `<button type="button" class="rubric-sum-row" data-step="${i}"><span>${esc(label)}</span><span class="rubric-sum-score ${b ? b.cls : ''}">${vals[key]} · ${b ? b.label : ''}</span></button>`;
          }).join("")}
        </div>
        <div class="rubric-total">Total <span class="bd-score">${total}</span><span class="bd-score-max">/100</span><span class="score-pill ${band.cls}">${band.label}</span></div>
        <textarea class="rubric-note" id="rub-note" maxlength="500" placeholder="Optional — a sentence on what you thought">${esc(note)}</textarea>
        <div class="modal-actions">
          ${mine ? `<button class="btn-ghost rubric-clear" id="rub-clear">Delete my review</button>` : ''}
          <button class="btn-ghost" id="rub-back">Back</button>
          <button class="btn-primary" id="rub-save">Submit review</button>
        </div>
      </div>`;
    const noteEl = back.querySelector("#rub-note");
    noteEl.addEventListener("input", () => { note = noteEl.value; });
    // Tap any summary row to jump back to that category.
    back.querySelectorAll(".rubric-sum-row").forEach(r => r.addEventListener("click", () => { step = Number(r.dataset.step); renderStep(); }));
    back.querySelector("#rub-back").addEventListener("click", () => { step = RUBRIC.length - 1; renderStep(); });
    const clearBtn = back.querySelector("#rub-clear");
    if (clearBtn) clearBtn.addEventListener("click", () => { close(); saveMyReview(bookTs, null); });
    back.querySelector("#rub-save").addEventListener("click", () => {
      const scores = {};
      RUBRIC.forEach(({ key }) => { scores[key] = vals[key]; });
      close();
      saveMyReview(bookTs, scores, note.trim());
    });
    back.querySelector("#rub-heading").focus();
  }

  function renderStep() { if (step < RUBRIC.length) renderCategory(); else renderSummary(); }
  renderStep();
}

// A lighter-weight modal for flagging a read as didn't-finish instead of
// scoring it through the rubric wizard — just an optional note on why.
function openDnfModal(bookTs, bookTitle) {
  const mine = myReviewFor(bookTs);

  const { back, close, focusFirst } = openModal({ labelledBy: "dnf-heading" });
