function wireUp() {
  // Tab switching.
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.tab;
      if (!id || id === currentTab) return;
      // render() defers while an input holds focus (Safari doesn't focus
      // buttons on click), so drop focus before switching.
      document.activeElement?.blur?.();
      goToTab(id);
    });
  });

  // Librarian dashboard sub-sections. Same rule as above: the switch goes
  // through goToTab(), or parseRoute() reverts it on the very next render.
  document.querySelectorAll("[data-subtab]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.subtab;
      if (!id || id === currentSubTab) return;
      document.activeElement?.blur?.();
      goToTab("admin", id);
    });
  });
  // The narrow-viewport equivalent -- four pills don't fit under a strip that
  // already scrolls, so under 560px the CSS swaps in this select instead.
  document.getElementById("sub-nav-select")?.addEventListener("change", (e) => {
    const id = e.currentTarget.value;
    e.currentTarget.blur();
    if (id && id !== currentSubTab) goToTab("admin", id);
  });

  const tabStrip = document.querySelector(".tabs");
  if (tabStrip) {
    tabStrip.classList.toggle("has-overflow", tabStrip.scrollWidth > tabStrip.clientWidth + 1);
    // Centre the active tab on a switch, as before -- but ALSO whenever it's
    // sitting outside the visible part of the strip, which a switch isn't the
    // only way to reach. Landing directly on a URL (a bookmark, a shared link,
    // a reload) renders with scrollLeft at 0 and no switch to react to, so a
    // tab near the end stayed half-clipped with nothing to suggest it could be
    // scrolled to. That went unnoticed while the labels happened to fit at
    // desktop width; renaming Admin -> Librarian pushed the strip 23px over and
    // made it visible on every load of this tab.
    const activeTabBtn = document.getElementById(`tab-btn-${currentTab}`);
    if (activeTabBtn) {
      const btnLeft = activeTabBtn.offsetLeft;
      const btnRight = btnLeft + activeTabBtn.offsetWidth;
      const viewLeft = tabStrip.scrollLeft;
      const viewRight = viewLeft + tabStrip.clientWidth;
      const outOfView = btnLeft < viewLeft || btnRight > viewRight;
      if (tabJustSwitched || outOfView) {
        const left = btnLeft - (tabStrip.clientWidth - activeTabBtn.clientWidth) / 2;
        // Jump rather than glide when the reader didn't ask for the movement --
        // an unprompted smooth scroll on first paint reads as the page twitching.
        tabStrip.scrollTo({ left: Math.max(0, left), behavior: tabJustSwitched ? "smooth" : "auto" });
      }
    }
  }

  // Month grid navigation (0 = jump back to the current month).
  document.querySelectorAll("[data-cal-nav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const delta = Number(btn.dataset.calNav);
      document.activeElement?.blur?.();
      if (delta === 0) {
        const p = clubParts(new Date());
        calendarMonth = { y: p.year, m: p.month };
      } else {
        calendarMonth = shiftMonth(calendarMonth || defaultCalendarMonth(), delta);
      }
      render();
    });
  });

  // Copy the calendar subscribe URL.
  const copyFeed = document.getElementById("copy-feed");
  if (copyFeed) copyFeed.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(CALENDAR_FEED_URL);
      setFlash("info", "Calendar URL copied — add it in your calendar app.");
    } catch {
      setFlash("err", "Couldn't copy. Long-press the URL to copy it manually.");
    }
  });

  // Librarian saves a read's meeting dates: 50% / 100%, plus Phase 12 §5.2's
  // any-number of extra named phases.
  document.querySelectorAll("[data-me-save]").forEach(btn => {
    btn.addEventListener("click", () => {
      const ts = btn.dataset.meSave;
      const box = btn.closest("[data-me-ts]");
      if (!box) return;
      const field = (name) => box.querySelector(`[data-me-field="${name}"]`);
      // Inputs are Toronto wall time, not the librarian's own timezone.
      const toIso = (v) => {
        const d = clubInputToInstant(v);
        return d ? d.toISOString() : "";
      };
      const extra = [...box.querySelectorAll("[data-me-extra-row]")].map(row => ({
        key: row.dataset.meExtraKey,
        label: (row.querySelector("[data-me-extra-label]")?.value || "").trim(),
        at: toIso(row.querySelector("[data-me-extra-at]")?.value),
      })).filter(x => x.key && x.label && x.at); // an emptied-out row just drops out
      const payload = {
        ts,
        half_at: toIso(field("half_at")?.value),
        half_upto: (field("half_upto")?.value || "").trim(),
        full_at: toIso(field("full_at")?.value),
        extra,
      };
      document.activeElement?.blur?.(); // let the post-save render through
      callAdmin("admin_set_meeting", payload);
    });
  });

  // Add a blank extra-meeting row without a full render (the reader is
  // mid-edit on other fields in this same form). The key is generated once,
  // right here -- see extraMeetingRowHtml's comment on why it must never
  // change afterward.
  document.querySelectorAll("[data-me-add-extra]").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.closest("[data-me-ts]");
      const list = box?.querySelector(".me-extra-list");
      if (!list) return;
      const key = `extra-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
      list.insertAdjacentHTML("beforeend", extraMeetingRowHtml({ key, label: "", at: "" }));
      wireExtraMeetingRemove(list.lastElementChild);
    });
  });
  document.querySelectorAll("[data-me-extra-row]").forEach(wireExtraMeetingRemove);

  // Re-post a read's already-saved dates to Discord (doesn't change them).
  document.querySelectorAll("[data-me-announce]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const ts = btn.dataset.meAnnounce;
      const h = state.history.find(x => x.ts === ts);
      const ok = await confirmModal(`Post the discussion dates for "${h?.book || 'this read'}" to Discord now?`, { title: "Post to Discord?", confirmLabel: "Post", danger: false });
      if (!ok) return;
      document.activeElement?.blur?.();
      callAdmin("admin_announce_meeting", { ts });
    });
  });

  const lbSearch = document.getElementById("lb-search");
  if (lbSearch) {
    const applyLb = () => {
      leaderboardQuery = lbSearch.value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll("#leaderboard-list .history-item").forEach(row => {
        const match = !leaderboardQuery || (row.dataset.search || "").includes(leaderboardQuery);
        row.style.display = match ? "" : "none";
        if (match) shown++;
      });
      const none = document.getElementById("lb-none");
      if (none) none.style.display = shown === 0 ? "" : "none";
    };
    lbSearch.addEventListener("input", applyLb);
    applyLb();
  }

  const gSearch = document.getElementById("global-search-input");
  if (gSearch) {
    const gResults = document.getElementById("global-search-results");
    const applyG = () => {
      globalSearchQuery = gSearch.value;
      gResults.innerHTML = globalSearchResultsHtml(globalSearchQuery);
      decorateCovers();
    };
    gSearch.addEventListener("input", applyG);
    gSearch.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { gSearch.value = ""; globalSearchQuery = ""; gResults.innerHTML = ""; gSearch.blur(); }
    });
  }

  const save = document.getElementById("save-book");
  if (save) save.addEventListener("click", () => {
    const val = document.getElementById("my-book").value;
    setMyBook(val);
  });
  const bookInput = document.getElementById("my-book");
  if (bookInput) bookInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") save && save.click();
  });
  const clear = document.getElementById("clear-book");
  if (clear) clear.addEventListener("click", async () => {
    if (!(await confirmModal("Clear your book? You can add another anytime.", { title: "Clear your book?", confirmLabel: "Clear", danger: false }))) return;
    setMyBook("");
  });

  const spinBtn = document.getElementById("spin-btn");
  if (spinBtn) spinBtn.addEventListener("click", runDraw);

  // Phase 9: the non-wheel draw paths. Rotation needs no payload -- the
  // server derives who's next from shelf_state.data.rotationCursor -- and
  // pick sends the chosen reader's id.
  const rotationBtn = document.getElementById("rotation-draw-btn");
  if (rotationBtn) rotationBtn.addEventListener("click", () => runNonWheelDraw({}));
  document.querySelectorAll("[data-pick-user]").forEach(el => {
    el.addEventListener("click", () => runNonWheelDraw({ user_id: el.dataset.pickUser }));
  });

  const undoBtn = document.getElementById("undo-btn");
  if (undoBtn) undoBtn.addEventListener("click", async () => {
    const last = state.history[0];
    if (!last) return;
    if (!(await confirmModal(`Undo the pick of "${last.book}" by ${last.winner_username}?`, { title: "Undo last spin?", confirmLabel: "Undo" }))) return;
    callAdmin("undo_last_spin", {});
  });

  document.querySelectorAll("[data-admin-editbook]").forEach(el => {
    el.addEventListener("click", async () => {
      const uid = el.dataset.adminEditbook;
      const u = users.find(x => x.id === uid);
      const current = (u?.book || "");
      const next = await promptModal(`Edit ${u?.discord_username || 'this reader'}'s book. This is silent — no Discord post.`, {
        title: "Edit reader's book", defaultValue: current, placeholder: "Book title — Author", confirmLabel: "Save",
      });
      if (next === null) return; // cancelled
      if (next.trim() === current.trim()) return; // unchanged
      callAdmin("admin_set_book", { user_id: uid, book: next.trim() });
    });
  });
  document.querySelectorAll("[data-admin-clear]").forEach(el => {
    el.addEventListener("click", async () => {
      const uid = el.dataset.adminClear;
      const u = users.find(x => x.id === uid);
      if (!(await confirmModal(`Clear ${u?.discord_username || 'this reader'}'s book?`, { title: "Clear reader's book?", confirmLabel: "Clear" }))) return;
      callAdmin("admin_clear_book", { user_id: uid });
    });
  });
  document.querySelectorAll("[data-admin-remove]").forEach(el => {
    el.addEventListener("click", async () => {
      const uid = el.dataset.adminRemove;
      const u = users.find(x => x.id === uid);
      const ok = await confirmModal(
        `Remove ${u?.discord_username || 'this reader'} from the shelf? Their past reads stay in the ledger, but they'll need to sign in again to rejoin.`,
        { title: "Remove reader?", confirmLabel: "Remove" },
      );
      if (!ok) return;
      callAdmin("admin_remove_user", { user_id: uid });
    });
  });
  // ---- Club settings (6a) ----
  document.getElementById("cs-save")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    const body = await callClubAdmin("update_club", {
      club_id: clubId(),
      name: document.getElementById("cs-name")?.value ?? "",
      tagline: document.getElementById("cs-tagline")?.value ?? "",
      timezone: document.getElementById("cs-tz")?.value ?? "",
      visibility: document.getElementById("cs-public")?.checked ? "public" : "private",
    });
    if (!body?.club) { render(); return; }
    // Adopt the saved row directly: the timezone change has to take effect for
    // every meeting time on screen, and a stale `club` would keep the old zone.
    club = { ...club, ...body.club };
    setFlash("info", "Club settings saved.");
    await loadMyClubs();
    render();
  });

  // ---- Reading selection (Phase 9) ----
  async function saveSelection(patch) {
    const body = await callClubAdmin("update_club", { club_id: clubId(), selection: patch });
    if (!body?.club) { render(); return; }
    club = { ...club, ...body.club };
    setFlash("info", "Reading selection saved.");
    render();
  }
  document.querySelectorAll("[data-sel-mode]").forEach(el => {
    el.addEventListener("click", (e) => { e.currentTarget.blur(); saveSelection({ mode: el.dataset.selMode }); });
  });
  document.getElementById("cs-sitout")?.addEventListener("change", (e) => {
    const checked = e.currentTarget.checked;
    e.currentTarget.blur();
    saveSelection({ sitOut: checked });
  });

  // ---- Rating rubric (Phase 10) ----
  document.getElementById("cs-rating-save")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    const categories = RATING_SLOTS
      .filter(slot => document.querySelector(`[data-rating-slot="${slot}"]`)?.checked)
      .map(slot => ({ slot, label: document.querySelector(`[data-rating-label="${slot}"]`)?.value ?? "" }));
    if (!categories.length) { setFlash("err", "Pick at least one rating category."); render(); return; }
    const scale = Number(document.getElementById("cs-rating-scale")?.value ?? 20);
    const scoreLabelInput = document.getElementById("cs-score-label")?.value ?? "";
    const body = await callClubAdmin("update_club", {
      club_id: clubId(),
      rating: { categories, scale, scoreLabel: scoreLabelInput },
    });
    if (!body?.club) { render(); return; }
    club = { ...club, ...body.club };
    setFlash("info", "Rating rubric saved.");
    render();
  });

  // ---- Notifications (Phase 11) ----
  document.querySelectorAll("[data-notify-key]").forEach(el => {
    el.addEventListener("change", async (e) => {
      const key = e.currentTarget.dataset.notifyKey;
      const checked = e.currentTarget.checked;
      const body = await callClubAdmin("update_club", { club_id: clubId(), notify: { [key]: checked } });
      if (!body?.club) { render(); return; }
      club = { ...club, ...body.club };
      setFlash("info", "Notification settings saved.");
      render();
    });
  });

  document.getElementById("cs-webhook-save")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    const input = document.getElementById("cs-webhook");
    const body = await callClubAdmin("set_club_webhook", { club_id: clubId(), webhook_url: input?.value ?? "" });
    if (!body?.ok) { render(); return; }
    if (input) input.value = "";
    clubSettings = { ...(clubSettings || {}), has_webhook: body.has_webhook };
    setFlash("info", body.has_webhook ? "Discord webhook saved." : "Discord webhook removed.");
    render();
  });

  // ---- Discord guild mapping (Phase 12 §5.4) ----
  document.getElementById("cs-guild-save")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    const input = document.getElementById("cs-guild-id");
    const body = await callClubAdmin("update_club", { club_id: clubId(), discord_guild_id: input?.value ?? "" });
    if (!body?.club) { render(); return; }
    club = { ...club, ...body.club };
    setFlash("info", "Discord server ID saved.");
    render();
  });

  document.getElementById("cs-cal-copy")?.addEventListener("click", async () => {
    const ok = await copyText(calendarFeedUrl(clubSettings?.calendar_token));
    setFlash(ok ? "info" : "err", ok ? "Calendar feed URL copied." : "Couldn't copy — select the URL instead.");
    render();
  });

  document.getElementById("cs-cal-rotate")?.addEventListener("click", async () => {
    const ok = await confirmModal(
      "Reset the calendar feed URL? Everyone currently subscribed will stop receiving updates and will need the new link.",
      { title: "Reset feed URL?", confirmLabel: "Reset" },
    );
    if (!ok) return;
    document.activeElement?.blur?.();
    const body = await callClubAdmin("rotate_calendar_token", { club_id: clubId() });
    if (!body?.calendar_token) { render(); return; }
    clubSettings = { ...(clubSettings || {}), calendar_token: body.calendar_token };
    setFlash("info", "Feed URL reset. Share the new one.");
    render();
  });

  // ---- Leave this club (4e) ----
  document.getElementById("leave-club")?.addEventListener("click", async (e) => {
    e.preventDefault();
    const ok = await confirmModal(
      `Leave ${clubName()}? Your past picks stay in its ledger, but you'll come off the shelf. You can rejoin with a new invite.`,
      { title: "Leave this club?", confirmLabel: "Leave" },
    );
    if (!ok) return;
    document.activeElement?.blur?.();
    const body = await callClubAdmin("leave_club", { club_id: clubId() });
    if (!body?.ok) { render(); return; }   // e.g. 409, last librarian
    setFlash("info", `You left ${clubName()}.`);
    club = null; clubStatus = "loading";
    await loadMyClubs();
    goAfterLeaving();
  });

  // ---- Invites (4d) ----
  document.getElementById("inv-new")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    const max = document.getElementById("inv-max")?.value;
    const days = document.getElementById("inv-days")?.value;
    const body = await callClubAdmin("create_invite", {
      club_id: clubId(),
      max_uses: max === "" ? null : max,
      expires_in_days: days === "" ? 0 : days,
    });
    if (!body?.invite) { render(); return; }
    await copyText(inviteLink(body.invite.code));
    setFlash("info", "Invite link created and copied to your clipboard.");
    await loadInvites();
    render();
  });
  document.querySelectorAll("[data-inv-copy]").forEach(el => {
    el.addEventListener("click", async () => {
      const ok = await copyText(inviteLink(el.dataset.invCopy));
      setFlash(ok ? "info" : "err", ok ? "Invite link copied." : "Couldn't copy — long-press the code instead.");
      render();
    });
  });
  document.querySelectorAll("[data-inv-revoke]").forEach(el => {
    el.addEventListener("click", async () => {
      const code = el.dataset.invRevoke;
      const ok = await confirmModal(`Revoke invite ${code}? Anyone still holding that link won't be able to join.`, { title: "Revoke invite?", confirmLabel: "Revoke" });
      if (!ok) return;
      document.activeElement?.blur?.();
      if (await callClubAdmin("revoke_invite", { club_id: clubId(), code })) {
        setFlash("info", "Invite revoked.");
        await loadInvites();
      }
      render();
    });
  });

  // ---- Delete this club (4e) ----
  document.getElementById("delete-club-btn")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    // Typing the name is the server's requirement too -- it re-checks, so this
    // prompt is a speed bump, not the guard.
    const cn = clubName();
    const typed = await promptModal(`This deletes "${cn}" and everything in it — permanently. Type the club's name to confirm.`, {
      title: "Delete this club?", placeholder: cn, confirmLabel: "Delete club", danger: true, requireMatch: cn,
    });
    if (typed === null) return;
    const body = await callClubAdmin("delete_club", { club_id: clubId(), confirm_name: typed.trim() });
    if (!body?.ok) { render(); return; }
    setFlash("info", `${clubName()} was deleted.`);
    club = null; clubStatus = "loading";
    await loadMyClubs();
    goAfterLeaving();
  });

  document.querySelectorAll("[data-admin-grant-lib]").forEach(el => {
    el.addEventListener("click", async () => {
      const uid = el.dataset.adminGrantLib;
      const u = users.find(x => x.id === uid);
      const ok = await confirmModal(`Make ${u?.discord_username || 'this reader'} a librarian? They'll get full admin controls.`, { title: "Grant librarian?", confirmLabel: "Make librarian", danger: false });
      if (!ok) return;
      await callAdmin("admin_grant_librarian", { user_id: uid });
      await loadLibrarianStatus();
      render();
    });
  });
  document.querySelectorAll("[data-admin-revoke-lib]").forEach(el => {
    el.addEventListener("click", async () => {
      const uid = el.dataset.adminRevokeLib;
      const u = users.find(x => x.id === uid);
      const ok = await confirmModal(`Revoke librarian from ${u?.discord_username || 'this reader'}? They'll lose admin controls.`, { title: "Revoke librarian?", confirmLabel: "Revoke" });
      if (!ok) return;
      await callAdmin("admin_revoke_librarian", { user_id: uid });
      await loadLibrarianStatus();
      render();
    });
  });

  document.querySelectorAll("[data-admin-rate]").forEach(el => {
    el.addEventListener("click", async () => {
      const ts = el.dataset.adminRate;
      const h = state.history.find(x => x.ts === ts);
      const current = ratingTotal(h);
      const next = await promptModal(`Set the ${scoreLabel()} (0–100) for "${h?.book || 'this read'}". Leave blank to clear.`, {
        title: `Set ${scoreLabel()}`, defaultValue: current == null ? "" : String(current), placeholder: "0–100", confirmLabel: "Save",
      });
      if (next === null) return; // cancelled
      const trimmed = next.trim();
      if (trimmed === "") {
        if (current == null) return; // already unrated
        callAdmin("admin_set_rating", { ts, total: null });
        return;
      }
      const n = Math.round(Number(trimmed));
      if (!Number.isFinite(n) || n < 0 || n > 100) { await alertModal("Enter a number from 0 to 100.", { title: "Invalid score" }); return; }
      if (n === current) return; // unchanged
      callAdmin("admin_set_rating", { ts, total: n });
    });
  });

  document.getElementById("export-club-btn")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    const body = await callClubAdmin("export_club", { club_id: clubId() });
    if (!body?.ok) { render(); return; }
    const { ok, ...payload } = body;
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${clubSlug()}-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setFlash("info", "Export downloaded.");
    render();
  });

  const reset = document.getElementById("reset-btn");
  if (reset) reset.addEventListener("click", async () => {
    const ok = await confirmModal(
      "Wipe the entire ledger — history, every reader's book, everything. This cannot be undone. Continue?",
      { title: "Reset the shelf?", confirmLabel: "Continue" },
    );
    if (!ok) return;
    promptResetConfirmation();
  });
  const signOutBtn = document.getElementById("sign-out-btn");
  if (signOutBtn) signOutBtn.addEventListener("click", signOut);
}

window.addEventListener("resize", () => {
  if (!spinning) paintWheel();
});

// ---------- Boot ----------
initAuth();
// Review buttons live on both the Currently reading banner and book pages, so
// handle them by delegation instead of per-render wiring.
document.addEventListener("click", async (e) => {
  // Close any open reader dropdown / reaction palette when the click lands
  // outside it. (A menu item click triggers a re-render, which rebuilds the
  // <details> closed anyway.)
  document.querySelectorAll("details.row-menu[open], details.react-menu[open]").forEach(d => {
    if (!d.contains(e.target)) d.removeAttribute("open");
  });
  // Collapse the header search when clicking outside it (a result click lands
  // inside .global-search, so navigation still fires before this clears it).
  if (globalSearchQuery && !e.target.closest(".global-search")) {
    globalSearchQuery = "";
    const gi = document.getElementById("global-search-input");
    const gr = document.getElementById("global-search-results");
    if (gi) gi.value = "";
    if (gr) gr.innerHTML = "";
  }
  // Jump to a tab from anywhere — including a book detail page, which is a
  // hash route, so this goes through the URL too (goToTab).
  const goto = e.target.closest("[data-goto-tab]");
  if (goto) {
    e.preventDefault();
    goToTab(goto.dataset.gotoTab);
    window.scrollTo(0, 0);
    return;
  }
  const rate = e.target.closest("[data-rate-ts]");
  if (rate) {
    const ts = rate.dataset.rateTs;
    const h = state.history.find(x => x.ts === ts);
    openRubricModal(ts, h?.book || "");
    return;
  }
  const dnf = e.target.closest("[data-dnf-ts]");
  if (dnf) {
    const ts = dnf.dataset.dnfTs;
    const h = state.history.find(x => x.ts === ts);
    openDnfModal(ts, h?.book || "");
    return;
  }
  const lock = e.target.closest("[data-lock-ts]");
  if (lock) { lockInScore(lock.dataset.lockTs); return; }
  const openBtn = e.target.closest("[data-openratings-ts]");
  if (openBtn) { setRatingsOpen(openBtn.dataset.openratingsTs, openBtn.dataset.open === "1"); return; }
  const cPost = e.target.closest("[data-comment-post]");
  if (cPost) {
    const parentId = cPost.dataset.parentId || null;
    const ta = document.getElementById(parentId ? "reply-input" : "comment-input");
    if (ta && ta.value.trim()) {
      document.activeElement?.blur?.();
      postComment(cPost.dataset.commentPost, ta.value, parentId);
      replyingTo = null;
    }
    return;
  }
  const cReply = e.target.closest("[data-comment-reply]");
  if (cReply) {
    document.activeElement?.blur?.();
    replyingTo = replyingTo === cReply.dataset.commentReply ? null : cReply.dataset.commentReply;
    render();
    return;
  }
  const cReplyCancel = e.target.closest("[data-comment-reply-cancel]");
  if (cReplyCancel) { document.activeElement?.blur?.(); replyingTo = null; render(); return; }
  const cDel = e.target.closest("[data-comment-delete]");
  if (cDel) {
    const id = cDel.dataset.commentDelete;
    const n = repliesFor(id).length;
    const msg = n ? `Delete this comment and its ${n} repl${n === 1 ? 'y' : 'ies'}?` : "Delete this comment?";
    if (await confirmModal(msg, { title: "Delete comment?", confirmLabel: "Delete" })) deleteComment(id);
    return;
  }
  const react = e.target.closest("[data-react-emoji]");
  if (react) { reactComment(react.dataset.reactComment, react.dataset.reactEmoji); return; }
});

// Comment composer niceties (delegated so they survive every re-render): a live
// character count, and ⌘/Ctrl+Enter to post. Applies to both the top-level
// composer (comment-input) and whichever reply box is open (reply-input).
document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "comment-input") {
    const c = document.getElementById("comment-count");
    if (c) c.textContent = `${e.target.value.length} / 2000`;
  }
  if (e.target && e.target.id === "reply-input") {
    const c = document.getElementById("reply-count");
    if (c) c.textContent = `${e.target.value.length} / 2000`;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.target && e.target.id === "comment-input" && (e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    const post = document.querySelector("[data-comment-post]:not([data-parent-id])");
    if (post && e.target.value.trim()) postComment(post.dataset.commentPost, e.target.value);
  }
  if (e.target && e.target.id === "reply-input" && (e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    const post = document.querySelector("[data-comment-post][data-parent-id]");
    if (post && e.target.value.trim()) { postComment(post.dataset.commentPost, e.target.value, post.dataset.parentId); replyingTo = null; }
  }
});

// A hash change can switch clubs, not just tabs. Re-resolve first when the slug
// actually differs, then reload that club's data -- otherwise render() would draw
// the new club's chrome over the old club's rows.
window.addEventListener("hashchange", async () => {
  const wanted = parseRoute().clubSlug;
  if (session && wanted && (!club || wanted !== club.slug)) {
    await resolveClubFromRoute();
    if (clubStatus !== "ok") { await loadMyClubs(); render(); return; }
    await loadLibrarianStatus();
    await loadAll();
    return; // loadAll renders
  }
  render();
});
window.addEventListener("focus", () => { if (session) queueRefresh(); });
</script>
