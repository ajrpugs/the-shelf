function computeStats() {
  const total = state.history.length;
  // Aggregate leaderboard by winner_id when present (survives username changes),
  // fall back to name for legacy entries without an id.
  const perUser = {};
  state.history.forEach(h => {
    if (!h.winner_id && !h.winner_username) return; // anonymous pick — off the leaderboard
    const key = h.winner_id || `name:${h.winner_username}`;
    if (!perUser[key]) {
      perUser[key] = {
        key,
        name: h.winner_username,
        avatar: h.winner_id ? userAvatar(h.winner_id) : null,
        count: 0,
      };
    } else if (!perUser[key].avatar && h.winner_id) {
      perUser[key].avatar = userAvatar(h.winner_id);
    }
    perUser[key].count++;
  });
  const leaderboard = Object.values(perUser).sort((a, b) => b.count - a.count);
  const maxPicks = leaderboard.reduce((m, e) => Math.max(m, e.count), 0);

  const picksThisRound = state.eliminated.length;
  const submittedCount = eligibleEntries().length;
  const regulars = new Set(state.history.map(h => h.winner_username).filter(Boolean)).size;
  const roundsFinished = Math.max(0, state.roundNumber - 1);
  const totalReaders = users.length;
  const wonUserIds = new Set(state.history.map(h => h.winner_id).filter(Boolean));
  const neverPicked = users.filter(u => !wonUserIds.has(u.id)).length;
  const monthAgo = Date.now() - 30 * 24 * 3600 * 1000;
  const booksThisMonth = state.history.filter(h => {
    const t = new Date(h.ts).getTime();
    return Number.isFinite(t) && t > monthAgo;
  }).length;
  const perRoundAvg = roundsFinished > 0 ? (total / roundsFinished).toFixed(1) : "—";

  return {
    total, leaderboard, maxPicks, picksThisRound, submittedCount, regulars,
    roundsFinished, totalReaders, neverPicked, booksThisMonth, perRoundAvg
  };
}

function userAvatar(userId) {
  const u = users.find(u => u.id === userId);
  return u?.avatar_url || null;
}

// The Bibliomancer's Guild rubric: five categories × 20 = /100. Bands come
// from the average category score (total / 5) to match the rubric's per-
// category ranges: Excellent ≥16, Great ≥11, Good ≥6, else Bad.
function ratingBand(total) {
  if (total == null || !Number.isFinite(total)) return null;
  if (total >= 80) return { label: "Excellent", cls: "band-exc" };
  if (total >= 55) return { label: "Great", cls: "band-great" };
  if (total >= 30) return { label: "Good", cls: "band-good" };
  return { label: "Bad", cls: "band-bad" };
}
function ratingTotal(h) {
  const t = h && h.rating && h.rating.total;
  return Number.isFinite(t) ? t : null;
}

// ---------- Member rubric reviews ----------
// The full catalog of the five possible rubric categories, each with the
// descriptions for the four bands (from the Guild rubric) shown as scoring
// guidance in the review wizard. This prose stays the same regardless of a
// club's config (Phase 10 configures which slots are active and what they're
// *labeled*, not the scoring-guidance text underneath).
// `short` is the compact one-word form used in the per-reviewer score
// breakdown line (bd-reviewer-scores) — derived by hand rather than sliced
// from `label`, since "Use of Language"/"Organization / Pacing"/"Themes /
// Ideas" don't reduce to a sensible word by taking e.g. the first one.
const RUBRIC_ALL = [
  { key: "plot", label: "Plot", short: "Plot", bands: {
    exc: "An exceptional, original, or deeply engaging story is consistently developed throughout the novel.",
    great: "An engaging story is developed throughout the novel. May contain exceptional or original moments.",
    good: "A sometimes engaging story is told. Plot may be underdeveloped or unoriginal.",
    bad: "The story is unengaging, plot points are nonsensical or uninteresting.",
  } },
  { key: "characters", label: "Characters", short: "Characters", bands: {
    exc: "Characters are extraordinarily well written and well developed.",
    great: "Overall, characters are well written and well developed.",
    good: "Some characters are well written and well developed. Some may lack depth or are otherwise poorly written.",
    bad: "Characters are uninspired or one dimensional.",
  } },
  { key: "pacing", label: "Organization / Pacing", short: "Pacing", bands: {
    exc: "Pacing feels appropriate throughout. Plot points come together in a very satisfying way, and do not feel forced.",
    great: "Pacing feels largely appropriate throughout. Plot points come together.",
    good: "Pacing feels somewhat appropriate. May feel rushed or dragged at times. Most plot points come together, but may be hard to follow or unsatisfying.",
    bad: "Lack of appropriate pacing. Often feels rushed or dragged out. Plot points are disconnected, hard to follow, or uninspired.",
  } },
  { key: "language", label: "Use of Language", short: "Language", bands: {
    exc: "Prose is spectacular, extraordinarily beautiful, or otherwise deeply satisfying.",
    great: "Prose is engaging, beautiful, or otherwise satisfying.",
    good: "Prose is largely engaging, and may have memorable moments.",
    bad: "Prose takes away from the enjoyment of the novel. May be needlessly complex or simplistic.",
  } },
  { key: "themes", label: "Themes / Ideas", short: "Themes", bands: {
    exc: "Themes or ideas are original, profound, or masterfully interwoven into the story. They invoked reflection or a strong emotional response.",
    great: "Themes or ideas have been thoughtfully interwoven into the story. They invoked reflection or an emotional response.",
    good: "Themes or ideas are at times effectively interwoven. They invoked some reflection and minimal emotional response.",
    bad: "Themes or ideas are explored clumsily. Any reflection or emotional response results from their frustrating or poor quality.",
  } },
];

// Phase 10: the club-scoped active subset of RUBRIC_ALL, in the club's own
// order and under the club's own labels -- what every one of the ~20
// call sites below actually reads, day to day. Refreshed by refreshRubric()
// at the top of every render(), which is early enough: nothing that reads
// RUBRIC is reachable except through a click handler wired up after a render
// has already happened. RATING_SCALE/SCORE_LABEL travel the same way.
let RUBRIC = RUBRIC_ALL;
let RATING_SCALE = 20;
let SCORE_LABEL = "Club score";
function refreshRubric() {
  const rc = clubConfig().rating;
  RATING_SCALE = rc.scale;
  SCORE_LABEL = rc.scoreLabel;
  RUBRIC = rc.categories.map(c => {
    const base = RUBRIC_ALL.find(r => r.key === c.slot) || RUBRIC_ALL[0];
    return { ...base, label: c.label };
  });
}
function scoreLabel() { return SCORE_LABEL; }

// Category-score band tiers for a given scale, fractions matching the /100
// total bands (80/55/30) exactly -- at the default scale 20 this reproduces
// today's fixed 16/11/6 thresholds bit-for-bit. `min` is each tier's lower
// bound; `mid` is the value a band card in the review wizard sets.
function ratingBandTiers(scale) {
  const mid = (a, b) => Math.round((a + b) / 2);
  const exc = Math.max(1, Math.round(scale * 0.8));
  const great = Math.max(1, Math.round(scale * 0.55));
  const good = Math.max(1, Math.round(scale * 0.3));
  return [
    { band: "exc", cls: "band-exc", label: "Excellent", range: `${exc}–${scale}`, mid: mid(exc, scale), min: exc },
    { band: "great", cls: "band-great", label: "Great", range: `${great}–${exc - 1}`, mid: mid(great, exc - 1), min: great },
    { band: "good", cls: "band-good", label: "Good", range: `${good}–${great - 1}`, mid: mid(good, great - 1), min: good },
    { band: "bad", cls: "band-bad", label: "Bad", range: `1–${good - 1}`, mid: mid(1, good - 1), min: 1 },
  ];
}
// Whether the librarian has opened member reviews on a read.
function ratingsOpen(h) {
  return !!(h && h.ratingsOpen);
}
// The current read = the oldest pick without a committed score. Reviews are
// only ever accepted here (never retroactively on past reads).
function currentReadTs() {
  const unrated = state.history.filter(h => ratingTotal(h) == null);
  return unrated.length ? unrated[unrated.length - 1].ts : null;
}
function isCurrentRead(h) {
  return !!h && h.ts === currentReadTs();
}
// Per-category band, scaled to the club's own per-category max (same
// fractions as the /100 total bands).
function categoryBand(score, scale = RATING_SCALE) {
  if (score == null || !Number.isFinite(score)) return null;
  const tiers = ratingBandTiers(scale);
  for (const t of tiers) { if (score >= t.min) return { label: t.label, cls: t.cls }; }
  return { label: "Bad", cls: "band-bad" };
}
function reviewsFor(bookTs) {
  return bookTs ? reviews.filter(r => r.book_ts === bookTs) : [];
}
function reviewTotal(r) {
  return normalizeTotal(RUBRIC.map(({ key }) => Number(r[key]) || 0), RATING_SCALE);
}
// Superlatives drawn from the member-review data: the read the club disagreed
// on most (highest spread of totals), and the harshest / most generous
// reviewers (lowest / highest average score given). Each needs ≥2 data points.
// DNF entries carry no score, so they're excluded here.
function reviewSuperlatives() {
  const byBook = {}, byUser = {};
  for (const r of reviews) {
    if (r.dnf) continue;
    const t = reviewTotal(r);
    (byBook[r.book_ts] ||= []).push(t);
    (byUser[r.user_id] ||= []).push(t);
  }
  let controversial = null;
  for (const [ts, totals] of Object.entries(byBook)) {
    if (totals.length < 2) continue;
    const mean = totals.reduce((a, b) => a + b, 0) / totals.length;
    const sd = Math.sqrt(totals.reduce((a, b) => a + (b - mean) ** 2, 0) / totals.length);
    const h = state.history.find(x => x.ts === ts);
    if (!h) continue;
    if (!controversial || sd > controversial.sd) controversial = { sd, round: h.round, book: h.book, count: totals.length };
  }
  let harsh = null, generous = null;
  for (const [uid, totals] of Object.entries(byUser)) {
    if (totals.length < 2) continue;
    const avg = totals.reduce((a, b) => a + b, 0) / totals.length;
    const u = users.find(x => x.id === uid);
    const name = u?.discord_username || "Reader";
    if (!harsh || avg < harsh.avg) harsh = { avg, name, id: uid, count: totals.length };
    if (!generous || avg > generous.avg) generous = { avg, name, id: uid, count: totals.length };
  }
  return { controversial, harsh, generous };
}
function myReviewFor(bookTs) {
  if (!session || !bookTs) return null;
  return reviews.find(r => r.book_ts === bookTs && r.user_id === session.user.id) || null;
}
// Average the members' rubric reviews for one read into a live scorecard.
// Returns null when nobody has scored it yet. DNF entries carry no score, so
// they're excluded (a reader who DNF'd still shows up in reviewsFor/the
// reviewer list, just without a score line).
function aggregateRubric(bookTs) {
  const rs = reviewsFor(bookTs).filter(r => !r.dnf);
  if (!rs.length) return null;
  const cats = {};
  const avgs = [];
  for (const { key } of RUBRIC) {
    const avg = rs.reduce((s, r) => s + (Number(r[key]) || 0), 0) / rs.length;
    cats[key] = avg;
    avgs.push(avg);
  }
  const roundedTotal = normalizeTotal(avgs, RATING_SCALE);
  return { count: rs.length, cats, total: roundedTotal, band: ratingBand(roundedTotal) };
}

// A reader's stable identity: their Discord id when linked, else name-based
// (so unlinked pickers like "Hunter" still aggregate and get a profile).
function readerKey(id, name) {
  return id ? id : `name:${name || ""}`;
}
function readerHref(id, name) {
  return `#reader=${encodeURIComponent(readerKey(id, name))}`;
}

// A hero banner for a single pick. Used for both "Next up" (history[0]) and
// "Currently reading" (older, still-unrated picks). The author/description/tag
// slots are left empty and filled in later by decorateBanners. When `showRate`
// is set (the Currently reading banner) the live member scorecard and the
// "Rate this read" / librarian "Lock in" controls are shown.
function bannerHtml(pick, { stamp, admin, showRate }) {
  const avatar = pick?.winner_id ? userAvatar(pick.winner_id) : null;
  let reviewBlock = "";
  if (showRate && pick.book) {
    const open = ratingsOpen(pick);
    const agg = aggregateRubric(pick.ts);
    const mine = myReviewFor(pick.ts);
    const dnfCount = reviewsFor(pick.ts).filter(r => r.dnf).length;
    const dnfSuffix = dnfCount ? ` · ${dnfCount} DNF` : '';
    let scoreLine, actions;
    if (!open) {
      // Ratings closed: members wait; the librarian can open them.
      scoreLine = admin
        ? `<span class="bn-review-count">Ratings are closed. Open them when the club is ready to score.</span>`
        : `<span class="bn-review-count">Ratings open on the call — hang tight.</span>`;
      actions = admin
        ? `<button class="btn-mini" data-openratings-ts="${attr(pick.ts || '')}" data-open="1">Open ratings</button>`
        : '';
    } else {
      scoreLine = agg
        ? `<span class="bd-score">${agg.total}<span class="bd-score-max">/100</span></span><span class="score-pill ${agg.band.cls}">${agg.band.label}</span><span class="bn-review-count">${agg.count} review${agg.count === 1 ? '' : 's'} so far${dnfSuffix}</span>`
        : dnfCount
          ? `<span class="bn-review-count">${dnfCount} DNF so far — no scores yet.</span>`
          : `<span class="bn-review-count">Ratings are open — score it together on the call.</span>`;
      actions = `
        <button class="btn-mini" data-rate-ts="${attr(pick.ts || '')}">${mine && !mine.dnf ? 'Edit my review' : 'Rate this read'}</button>
        <button class="btn-mini ghost" data-dnf-ts="${attr(pick.ts || '')}">${mine && mine.dnf ? 'Edit DNF note' : 'Didn’t finish it?'}</button>
        ${(admin && agg) ? `<button class="btn-mini lock" data-lock-ts="${attr(pick.ts || '')}">Lock in ${esc(scoreLabel())}</button>` : ''}
        ${admin ? `<button class="btn-mini ghost" data-openratings-ts="${attr(pick.ts || '')}" data-open="0">Close ratings</button>` : ''}`;
    }
    reviewBlock = `
      <div class="bn-review">
        <div class="bn-review-score">${scoreLine}</div>
        <div class="bn-review-actions">${actions}</div>
      </div>`;
  }
  return `
    <div class="winner-banner" data-banner-book="${attr(pick.book || '')}">
      <div class="stampbig">${esc(stamp)}</div>
      <div class="wn-top">
        <div class="cover-slot large" data-cover-title="${attr(pick.book || '')}"></div>
        <div class="wn-head">
          <div class="wbook">${pick.book ? `<a class="book-link" href="#book=${pick.round}">${esc(pick.book)}</a>` : '—'}</div>
          ${pick.book ? `<div class="wauthor bn-author"></div>` : ''}
          ${pick.book ? `<div class="wmeta book-meta" data-meta-title="${attr(pick.book)}"></div>` : ''}
          <div class="wname">
            picked by
            ${avatar ? `<img class="avatar-mini" src="${attr(avatar)}" alt="">` : ''}
            <a class="reader-link" href="${readerHref(pick.winner_id, pick.winner_username)}"><b>${esc(pick.winner_username)}</b></a>
          </div>
        </div>
      </div>
      ${pick.book ? `<div class="wdesc bn-desc"></div>` : ''}
      ${pick.book ? `<div class="wtags genre-tags bn-tags"></div>` : ''}
      ${bookMeetingsHtml(pick)}
      ${reviewBlock}
      ${pick.book ? `<a class="wmore" href="#book=${pick.round}">Full details →</a>` : ''}
    </div>
  `;
}

// Human "3 days ago" / "in 2 hours" for comment and meeting timestamps. Falls
// back to the absolute date past a week so old threads stay legible.
function relTime(iso) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const diff = t - Date.now();
  const past = diff < 0;
  const s = Math.abs(diff) / 1000;
  const mins = Math.round(s / 60), hrs = Math.round(s / 3600), days = Math.round(s / 86400);
  if (s < 45) return past ? "just now" : "in a moment";
  if (s < 3600) return past ? `${mins} min ago` : `in ${mins} min`;
  if (s < 86400) return past ? `${hrs} hr${hrs === 1 ? '' : 's'} ago` : `in ${hrs} hr${hrs === 1 ? '' : 's'}`;
  if (days <= 7) return past ? `${days} day${days === 1 ? '' : 's'} ago` : `in ${days} day${days === 1 ? '' : 's'}`;
  return fmtDate(iso);
}

// Turn bare URLs in user text into links, escaping everything else first so
// this stays injection-safe. Used in comments.
function linkifyEsc(text) {
  return esc(text).replace(/https?:\/\/[^\s<]+/g, (u) =>
    `<a class="comment-url" href="${attr(u)}" target="_blank" rel="noopener nofollow">${u}</a>`);
}

// ---- Global search (books + readers), filtered client-side ----
function globalSearchResults(q) {
  const needle = q.trim().toLowerCase();
  if (!needle) return { reads: [], readers: [] };
  const reads = state.history
    .filter(h => `${h.book || ""} ${h.winner_username || ""}`.toLowerCase().includes(needle))
    .slice(0, 6);
  const seen = new Set();
  const readers = [];
  for (const u of users) {
    if (`${u.discord_username || ""} ${u.book || ""}`.toLowerCase().includes(needle)) {
      readers.push({ key: readerKey(u.id, u.discord_username), name: u.discord_username || "Reader", avatar: u.avatar_url, book: u.book });
      seen.add(u.id);
    }
    if (readers.length >= 6) break;
  }
  return { reads, readers };
}
function globalSearchResultsHtml(q) {
  const { reads, readers } = globalSearchResults(q);
  if (!q.trim()) return "";
  if (!reads.length && !readers.length) return `<div class="gsearch-empty">No books or readers match “${esc(q.trim())}”.</div>`;
  let h = "";
  if (reads.length) {
    h += `<div class="gsearch-group"><div class="gsearch-head">Books</div>`;
    for (const r of reads) {
      h += `<a class="gsearch-item" href="#book=${r.round}"><span class="cover-slot tiny" data-cover-title="${attr(r.book || '')}"></span><span class="gsearch-label">${esc(r.book || '')}</span><span class="gsearch-sub">Round ${r.round}</span></a>`;
    }
    h += `</div>`;
  }
  if (readers.length) {
    h += `<div class="gsearch-group"><div class="gsearch-head">Readers</div>`;
    for (const r of readers) {
      h += `<a class="gsearch-item" href="${readerHref(r.key.startsWith('name:') ? null : r.key, r.name)}">${r.avatar ? `<img class="avatar-mini" src="${attr(r.avatar)}" alt="">` : `<span class="leader-avatar-placeholder"></span>`}<span class="gsearch-label">${esc(r.name)}</span>${r.book ? `<span class="gsearch-sub">${esc(r.book)}</span>` : ''}</a>`;
    }
    h += `</div>`;
  }
  return h;
}

// ---- Own-profile card (top of your own reader page) ----
// Shown only on your own profile: your round standing, your book (with a jump to
// edit it on the Shelf tab), and a welcome line for brand-new members.
function ownProfileCardHtml() {
  const myId = session.user.id;
  const myBook = (myUserRow?.book || "").trim();
  const iAmEliminated = state.eliminated.includes(myId);
  const myReviews = (reviews || []).filter(r => r.user_id === myId);
  const myScoredReviews = myReviews.filter(r => !r.dnf);
  const avgGiven = myScoredReviews.length ? Math.round(myScoredReviews.reduce((s, r) => s + reviewTotal(r), 0) / myScoredReviews.length) : null;
  const myPicks = state.history.filter(h => h.winner_id === myId).length;
  const brandNew = !myBook && !myPicks && !myReviews.length;

  const status = !myBook
    ? { cls: "dash-status-warn", label: "No book on the shelf" }
    : iAmEliminated
      ? { cls: "dash-status-out", label: "Picked this round — sitting out" }
      : { cls: "dash-status-in", label: "Eligible for the wheel" };

  let h = `<div class="dash card no-rule">`;
  h += `<div class="dash-top">
      <span class="dash-k">Your shelf</span>
      <span class="dash-status ${status.cls}">${status.label}</span>
    </div>`;
  if (brandNew) {
    h += `<div class="dash-welcome">Welcome to the Shelf. Add a book and you’re in the next spin.</div>`;
  }
  h += `<div class="dash-book">
      <span class="dash-k">Your book</span>
      <span class="dash-v ${myBook ? '' : 'dash-v-empty'}">${myBook ? esc(myBook) : 'nothing on the shelf yet'}</span>
      <button class="btn-mini dash-edit" data-goto-tab="shelf">${myBook ? 'Edit' : 'Add'}</button>
    </div>`;
  if (myReviews.length) {
    h += `<div class="dash-stats"><span><b>${myReviews.length}</b> reviewed</span><span class="dash-dot">·</span><span>avg <b>${avgGiven}</b> given</span></div>`;
  }
  h += `</div>`;
  return h;
}

function render() {
  if (spinning) { pendingRender = true; return; }
  if (document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    pendingRender = true;
    return;
  }
  pendingRender = false;

  const app = document.getElementById("app");

  if (!CONFIGURED) {
    app.innerHTML = renderSetupNotice();
    return;
  }

  // Reachable signed in or out -- it's the one page that has to be readable
  // before someone even has an account.
  if (parseRoute().name === "legal") { app.innerHTML = renderLegal(); wireLegal(); return; }

  if (!session) {
    app.innerHTML = renderLoginGate();
    wireLoginGate();
    return;
  }

  // Creating and joining come before club resolution -- neither has a club yet.
  const preRoute = parseRoute();
  if (preRoute.name === "new-club") { app.innerHTML = renderNewClub(); wireNewClub(); return; }
  if (preRoute.name === "join") { app.innerHTML = renderJoin(preRoute.code); wireJoin(preRoute.code); return; }
  // Account settings sits outside club resolution: it's about the person, and it
  // has to be reachable by someone who belongs to no clubs at all.
  if (preRoute.name === "account") { app.innerHTML = renderAccount(); wireAccount(); return; }

  // A reader who belongs to nothing: the normal first screen for a brand-new
  // account now that the auto-join is gone, and also where you land after
  // leaving or deleting your last club.
  if (clubStatus === "no-clubs") { app.innerHTML = renderNoClubs(); wireNoClubs(); return; }

  // A club that couldn't be resolved gets its own page rather than an empty
  // shelf, which would look like a working club with nothing in it.
  if (clubStatus === "not_found" || clubStatus === "not_member" || clubStatus === "suspended") {
    app.innerHTML = renderClubProblem();
    document.querySelector("[data-go-default-club]")?.addEventListener("click", () => {
      location.hash = `#/c/${DEFAULT_CLUB_SLUG}/reading`;
    });
    document.querySelectorAll("[data-go-club]").forEach(el => {
      el.addEventListener("click", () => goToClub(el.dataset.goClub));
    });
    return;
  }

  // Nothing club-scoped has landed yet, so every array below is empty and `club`
  // may still be null. Drawing the main view here paints the default club's
  // chrome over no data at all, which is indistinguishable from a brand-new
  // club: round 1, an empty shelf, and clubNeedsOnboarding()'s "Welcome to ..."
  // checklist. A reader saw exactly that for the ~1.2s of a first sign-in,
  // because supabase-js clears the OAuth fragment with `location.hash = ""` --
  // which fires our hashchange listener, and its render() lands long before
  // loadAll() does. Hold the boot placeholder until there's something real.
  if (clubStatus === "loading" || !clubDataLoaded) {
    app.innerHTML = BOOT_PLACEHOLDER;
    return;
  }

  // Phase 10: club is resolved and its data loaded, so config.rating is
  // meaningful now -- refresh before ANY route below, including the detail
  // pages (book/tag/reader/recap) that read RUBRIC/RATING_SCALE/scoreLabel()
  // through their own early returns rather than falling through to the main
  // view further down.
  refreshRubric();

  const route = parseRoute();
  if (route.tab) currentTab = route.tab;
  // An unknown or absent sub-section falls back to the first one rather than
  // rendering an empty dashboard.
  currentSubTab = ADMIN_SECTIONS.some(s => s.id === route.sub) ? route.sub : "overview";
  // Scroll to top only on an actual navigation into a detail route (hash
  // changed since the last render), not on every re-render of the same page
  // triggered by a button click (reply, react, post/delete a comment, ...).
  const routeHash = location.hash || "";
  if (route.name !== "main" && routeHash !== lastRenderedHash) window.scrollTo(0, 0);
  lastRenderedHash = routeHash;
  if (route.name === "book") {
    renderBookDetail(app, { kind: "past", round: route.round });
    return;
  }
  if (route.name === "shelf") {
    renderBookDetail(app, { kind: "shelf", userId: route.userId });
    return;
  }
  if (route.name === "tag") {
    renderTagPage(app, route.tag);
    return;
  }
  if (route.name === "reader") {
    renderReaderPage(app, route.key);
    return;
  }
  if (route.name === "recap") {
    renderRecap(app, route.year);
    return;
  }

  const stats = computeStats();
  const admin = isAdmin();
  const displayName = displayNameFromMeta(session.user);
  const avatar = session.user.user_metadata?.avatar_url;
  const myBook = (myUserRow?.book || "").trim();
  const iAmEliminated = state.eliminated.includes(session.user.id);
  const eligibleSubs = eligibleEntries();
  const eligibleCount = eligibleSubs.length;
  // Books split by role from rating status alone. Unrated picks are in flight:
  // the *oldest* unrated is what the club is reading now ("Currently reading"),
  // and any newer unrated picks are queued ("Next up"). Rated picks are done and
  // belong on the leaderboard. So scoring the current read drops it to the
  // leaderboard and the next-up automatically becomes the new oldest-unrated —
  // i.e. it promotes to Currently reading on the very next render.
  const unrated = state.history.filter(h => ratingTotal(h) == null); // newest-first
  const currentlyReading = unrated.length ? unrated[unrated.length - 1] : null;
  const nextUp = unrated.slice(0, -1).reverse(); // newer picks, soonest-to-read first

  let html = `
    <header>
      <div class="eyebrow">The Shelf · Round ${state.roundNumber}${admin ? '<span class="librarian-tag">Librarian</span>' : ''}</div>
      <h1>${esc(clubName())}</h1>
      <div class="sub">${esc(clubTagline())}</div>
      <div class="rule"></div>
      <details class="row-menu profile-menu">
        <summary class="profile-menu-toggle" title="${esc(displayName)}" aria-label="Account menu">
          ${avatar ? `<img class="avatar" src="${attr(avatar)}" alt="">` : `<span class="profile-menu-fallback">${esc(displayName.slice(0, 1).toUpperCase())}</span>`}
        </summary>
        <div class="row-menu-list profile-menu-list">
          <div class="profile-menu-name">${esc(displayName)}</div>
          <a class="row-menu-item" href="${readerHref(session.user.id, displayName)}">My Profile</a>
          <a class="row-menu-item" href="#/account">Settings</a>
          <button class="row-menu-item" id="sign-out-btn">Sign out</button>
        </div>
      </details>
    </header>
  `;

  if (flashMsg) {
    html += `<div class="flash ${flashMsg.kind === 'info' ? 'info' : ''}" role="status" aria-live="polite">${esc(flashMsg.text)}</div>`;
  }

  // ---- Tab bar ----
  // Phase 11 §4.3: small unread badges, since you last looked at this club.
  const unread = unreadCounts();
  const tabBadge = (n) => n > 0
    ? `<span style="display:inline-block; min-width:16px; padding:0 4px; margin-left:6px; border-radius:999px; background:var(--stamp); color:var(--card); font-size:10px; font-weight:700; line-height:16px; text-align:center; vertical-align:middle;">${n > 99 ? '99+' : n}</span>`
    : '';
  const TABS = [
    { id: "reading", label: "Reading", badge: tabBadge(unread.picks) },
    { id: "shelf", label: "The Shelf" },
    { id: "wheel", label: "The Wheel" },
    { id: "leaderboard", label: "Leaderboard" },
    { id: "stats", label: "Stats" },
    { id: "reviews", label: "Reviews", badge: tabBadge(unread.reviews) },
    { id: "calendar", label: "Calendar" },
    // The route segment stays "admin" -- it's bookmarked, and renaming it would
    // break every existing link for the sake of a label.
    ...(admin ? [{ id: "admin", label: "Librarian", adminTab: true }] : []),
  ];
  if (!TABS.some(t => t.id === currentTab)) currentTab = "reading";
  html += `<nav class="tabs" role="tablist" aria-label="Sections">${TABS.map(t =>
    `<button class="tab-btn ${t.adminTab ? 'tab-admin' : ''} ${currentTab === t.id ? 'on' : ''}" id="tab-btn-${t.id}" role="tab" aria-selected="${currentTab === t.id ? 'true' : 'false'}" aria-controls="tab-panel" data-tab="${t.id}">${t.label}${t.badge || ''}</button>`
  ).join("")}</nav>`;

  // ---- Global search (books + readers) ----
  html += `<div class="global-search">
      <span class="gsearch-icon" aria-hidden="true">⌕</span>
      <input type="text" id="global-search-input" class="gsearch-input" placeholder="Search books & readers…" autocomplete="off" aria-label="Search books and readers" value="${attr(globalSearchQuery)}">
      <div id="global-search-results" class="gsearch-results">${globalSearchResultsHtml(globalSearchQuery)}</div>
    </div>`;

  const tabSwitched = currentTab !== lastRenderedTab;
  lastRenderedTab = currentTab;
  tabJustSwitched = tabSwitched;
  html += `<div class="tab-body${tabSwitched ? ' tab-enter' : ''}" id="tab-panel" role="tabpanel" aria-labelledby="tab-btn-${currentTab}" tabindex="0">`;

  // ---- Reading: Currently reading + Next up ----
  if (currentTab === "reading") {
    // A brand-new club gets the three-step checklist instead of a stack of empty
    // states (4f). It stops appearing as soon as a reader joins or a book is set.
    if (clubNeedsOnboarding()) html += renderClubOnboarding();
    // The rate pill lives on Currently reading — the book you finish and score.
    if (currentlyReading) {
      html += bannerHtml(currentlyReading, { stamp: "Currently reading", admin, showRate: true });
    }
    nextUp.forEach(pick => {
      html += bannerHtml(pick, { stamp: "Next up", admin, showRate: false });
    });
    if (!currentlyReading && nextUp.length === 0) {
      html += `<div class="empty-block">Nothing on the go yet.<br>Spin the wheel to pick the first read.</div>`;
    }
  }

  // ---- The Shelf: My book + On the shelf ----
  if (currentTab === "shelf") {
  // ---- My book ----
  html += `
    <section>
      <div class="section-title">My book</div>
      <div class="card no-rule my-book-card">
        <div class="my-book-row">
          <input type="text" id="my-book" placeholder="What you'd like to read" value="${attr(myBook)}" autocomplete="off" />
          <button class="btn-primary" id="save-book">Save</button>
        </div>
        ${iAmEliminated
          ? `<div class="my-book-status waiting">Picked this round — see you next round.</div>`
          : myBook
            ? `<div class="my-book-status active">On the shelf<button class="link-clear" id="clear-book">clear</button></div>`
            : `<div class="my-book-status">Add a book to join the shelf.</div>`
        }
      </div>
    </section>
  `;

  // ---- On the shelf ----
  html += `<section><div class="section-title">On the shelf</div>`;
  if (eligibleSubs.length === 0) {
    html += `<div class="empty-block">The shelf is empty.<br>Be the first to add a book above.</div>`;
  } else {
    eligibleSubs.forEach(entry => {
      html += `
        <div class="card">
          <div class="card-row" style="align-items: flex-start;">
            <span class="cover-slot small" data-cover-title="${attr(entry.book)}"></span>
            <div style="flex:1; min-width:0;">
              <div class="name"><span class="shelf-title" data-shelf-id="${attr(entry.id)}" data-link-title="${attr(entry.book)}">${esc(entry.book)}</span><span class="book-meta" data-meta-title="${attr(entry.book)}"></span></div>
              <div class="submitted-book">
                ${entry.avatar_url ? `<img class="avatar-mini" src="${attr(entry.avatar_url)}" alt="">` : ''}
                submitted by <a class="reader-link" href="${readerHref(entry.id, entry.name)}">${esc(entry.name)}</a>
              </div>
            </div>
          </div>
        </div>
      `;
    });
  }
  html += `</section>`;
  } // end shelf tab

  // ---- The Wheel: Choose our next read ----
  // Phase 9 (docs/configurability-plan.md §2): the tab stays "The Wheel" in
  // every mode -- renaming it per-club would just be another thing to keep in
  // sync -- but what's inside it depends on config.selection.mode. Only
  // `wheel` gets the canvas and the spin animation; `rotation` and `pick`
  // show a plain reader list, since there's nothing random to draw.
  if (currentTab === "wheel") {
  const selMode = clubConfig().selection.mode;
  html += `<section><div class="section-title">Choose our next read</div>`;
  const noneNote = `<div style="font-size: 12px; color: var(--muted); font-style: italic;">Only the librarian can choose the next read.</div>`;
  if (selMode === "rotation") {
    const queue = rotationQueue();
    if (queue.length === 0) {
      html += `<div class="wheel-empty">Add a book above to fill the shelf.</div>`;
    } else {
      html += `<div class="card no-rule">`;
      queue.forEach((u, i) => {
        html += `
          <div class="user-row">
            ${u.avatar_url ? `<img class="leader-avatar" src="${attr(u.avatar_url)}" alt="">` : `<span class="leader-avatar-placeholder"></span>`}
            <div class="user-row-content">
              <div class="user-row-name">${esc(u.name)}${i === 0 ? `<span class="user-row-tag lib">Up next</span>` : ''}</div>
              <div class="user-row-book">${esc(u.book)}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      html += `<div class="spin-caption">${queue.length} in the rotation</div>`;
    }
    html += `<div class="spin-actions">`;
    html += admin
      ? `<button class="btn-primary" id="rotation-draw-btn" ${(queue.length === 0 || spinning) ? 'disabled' : ''}>${spinning ? 'Choosing…' : 'Choose next read'}</button>`
      : noneNote;
    html += `</div>`;
  } else if (selMode === "pick") {
    const pool = selectionPool();
    if (pool.length === 0) {
      html += `<div class="wheel-empty">Add a book above to fill the shelf.</div>`;
    } else if (admin) {
      html += `<div class="card no-rule" style="display:flex; flex-direction:column; gap:6px;">`;
      pool.forEach(u => {
        html += `<button class="row-menu-item" data-pick-user="${attr(u.id)}" ${spinning ? 'disabled' : ''}>${esc(u.name)} — ${esc(u.book)}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="card no-rule">`;
      pool.forEach(u => {
        html += `
          <div class="user-row">
            ${u.avatar_url ? `<img class="leader-avatar" src="${attr(u.avatar_url)}" alt="">` : `<span class="leader-avatar-placeholder"></span>`}
            <div class="user-row-content">
              <div class="user-row-name">${esc(u.name)}</div>
              <div class="user-row-book">${esc(u.book)}</div>
            </div>
          </div>
        `;
      });
      html += `</div>`;
      html += `<div class="spin-actions">${noneNote}</div>`;
    }
  } else {
    if (eligibleCount === 0) {
      html += `<div class="wheel-empty">Add a book above to fill the shelf.</div>`;
    } else {
      // The canvas has nothing for a screen reader to read beyond a static
      // label, so describe it with the actual roster -- hidden visually,
      // present in the DOM for anyone not looking at the spinning wheel.
      html += `
        <div class="wheel-holder">
          <div class="wheel-pointer"></div>
          <canvas id="wheel-canvas" class="wheel-canvas" role="img" aria-label="Wheel of eligible readers" aria-describedby="wheel-reader-list"></canvas>
        </div>
        <ul id="wheel-reader-list" class="sr-only">
          ${eligibleSubs.map(e => `<li>${esc(e.name)} — ${esc(e.book)}</li>`).join("")}
        </ul>
        <div class="spin-caption">${eligibleCount} book${eligibleCount === 1 ? '' : 's'} on the shelf</div>
      `;
    }
    html += `<div class="spin-actions">`;
    html += admin
      ? `<button class="btn-primary" id="spin-btn" ${(eligibleCount === 0 || spinning) ? 'disabled' : ''}>${spinning ? 'Choosing…' : 'Choose our next read'}</button>`
      : noneNote;
    html += `</div>`;
  }
  html += `</section>`;
  } // end wheel tab

  // ---- Leaderboard (finished reads, ranked by Guild rating) ----
  if (currentTab === "leaderboard") {
  // Rated books only — in-progress reads live in the hero banners above, so
  // nothing unrated clutters the ranking.
  html += `<section><div class="section-title">Leaderboard</div>`;
  const rated = state.history.filter(h => ratingTotal(h) != null);
  if (rated.length === 0) {
    html += `<div class="empty-block">No books rated yet.</div>`;
  } else {
    if (rated.length > 6) {
      html += `<input type="text" id="lb-search" class="lb-search" placeholder="Search past reads by title or reader…" autocomplete="off" value="${attr(leaderboardQuery)}">`;
    }
    html += `<div class="card no-rule" id="leaderboard-list">`;
    const ranked = rated.sort((a, b) => {
      const ra = ratingTotal(a), rb = ratingTotal(b);
      if (rb !== ra) return rb - ra; // higher rating first
      return b.round - a.round;   // tie-break: newest first
    });
    ranked.forEach((h, i) => {
      const avatar = h.winner_id ? userAvatar(h.winner_id) : null;
      const total = ratingTotal(h);
      const band = ratingBand(total);
      const hay = `${h.book || ''} ${h.winner_username || ''}`.toLowerCase();
      html += `
        <div class="history-item" data-search="${attr(hay)}">
          <span class="lb-rank">${i + 1}</span>
          <span class="cover-slot tiny" data-cover-title="${attr(h.book || '')}"></span>
          <span class="h-content">
            ${h.winner_username
              ? `${avatar ? `<img class="avatar-mini" src="${attr(avatar)}" alt="">` : ''}<a class="h-who reader-link" href="${readerHref(h.winner_id, h.winner_username)}">${esc(h.winner_username)}</a> — <a class="book-link" href="#book=${h.round}">${esc(h.book || '')}</a>`
              : `<a class="book-link" href="#book=${h.round}">${esc(h.book || '')}</a>`}<span class="book-meta" data-meta-title="${attr(h.book || '')}"></span>
          </span>
          <span class="h-meta">Round ${h.round} · ${fmtDate(h.ts)}</span>
          ${admin
            ? `<button class="score-pill ${band ? band.cls : 'score-pill-empty'}" data-admin-rate="${attr(h.ts || '')}" title="Set score (librarian)" aria-label="Set ${attr(scoreLabel())} for ${attr(h.book || 'this read')}">${band ? total : '＋'}</button>`
            : (band ? `<span class="score-pill ${band.cls}" title="${band.label} · ${total}/100">${total}</span>` : `<span class="score-pill" style="visibility:hidden">00</span>`)}
        </div>
      `;
    });
    html += `<div class="empty-note" id="lb-none" style="display:none;">No past reads match that.</div>`;
    html += `</div>`;
  }
  html += `</section>`;
  } // end leaderboard tab

  // ---- Stats ----
  if (currentTab === "stats") {
  // Club numbers render now; the API-derived tiles/blocks (pages, reading time,
  // superlatives, decades, genres) fill in via decorateStats once the Open
  // Library metadata for every past read resolves.
  html += `<section><div class="section-title">Stats</div>`;
  html += `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Books read</div>
        <div class="stat-number">${stats.total}</div>
        <div class="stat-suffix">all rounds</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pages turned</div>
        <div class="stat-number" id="stat-pages">—</div>
        <div class="stat-suffix">across the shelf</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg length</div>
        <div class="stat-number" id="stat-avg">—</div>
        <div class="stat-suffix">pages / book</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Reading time</div>
        <div class="stat-number" id="stat-hours">—</div>
        <div class="stat-suffix">hours, roughly</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Readers</div>
        <div class="stat-number">${stats.totalReaders}</div>
        <div class="stat-suffix">signed in</div>

// ---------- Router + book detail page ----------
// ---------- Year in books recap ----------
function availableRecapYears() {
  const years = new Set();
  for (const h of state.history) {
    const y = h.ts ? new Date(h.ts).getFullYear() : NaN;
    if (Number.isFinite(y)) years.add(y);
  }
  return [...years].sort((a, b) => b - a);
}
function recapReadRow(h) {
  const total = ratingTotal(h);
  const band = ratingBand(total);
  return `<div class="history-item">
    <span class="cover-slot tiny" data-cover-title="${attr(h.book || '')}"></span>
    <span class="h-content"><a class="book-link" href="#book=${h.round}">${esc(h.book || '')}</a>${h.winner_username ? ` <span class="recap-picker">— <a class="reader-link" href="${readerHref(h.winner_id, h.winner_username)}">${esc(h.winner_username)}</a></span>` : ''}</span>
    <span class="h-meta">${fmtDate(h.ts)}</span>
    ${band ? `<span class="score-pill ${band.cls}">${total}</span>` : `<span class="score-pill" style="visibility:hidden">00</span>`}
  </div>`;
}
function renderRecap(app, year) {
  const back = `<a href="#" class="detail-back">← Back to the shelf</a>`;
  const years = availableRecapYears();
  if (!years.length) {
    app.innerHTML = `<header><div class="eyebrow">The Shelf</div><h1>Year in books</h1><div class="rule"></div></header>${back}<div class="setup"><h2>Nothing to recap yet</h2><p>Once the club has read a few books, the year in books shows up here.</p></div>`;
    return;
  }
  const y = years.includes(year) ? year : years[0];
  const reads = state.history.filter(h => h.ts && new Date(h.ts).getFullYear() === y);
  const ratedReads = reads.filter(h => ratingTotal(h) != null).sort((a, b) => ratingTotal(b) - ratingTotal(a));
  const top = ratedReads[0] || null;
  const low = ratedReads.length > 1 ? ratedReads[ratedReads.length - 1] : null;
  const avg = ratedReads.length ? Math.round(ratedReads.reduce((s, h) => s + ratingTotal(h), 0) / ratedReads.length) : null;
  const avgBand = avg != null ? ratingBand(avg) : null;
  const reviewCount = reads.reduce((s, h) => s + reviewsFor(h.ts).length, 0);
  const pickCounts = {};
  reads.forEach(h => {
    const k = readerKey(h.winner_id, h.winner_username);
    (pickCounts[k] ||= { count: 0, name: h.winner_username, id: h.winner_id });
    pickCounts[k].count++;
  });
  const topReader = Object.values(pickCounts).sort((a, b) => b.count - a.count)[0] || null;
  const yearNav = years.map(yy => `<a class="recap-year ${yy === y ? 'on' : ''}" href="#recap=${yy}">${yy}</a>`).join("");

  app.innerHTML = `
    <header><div class="eyebrow">The Shelf</div><h1>Year in books</h1><div class="rule"></div></header>
    ${back}
    <div class="recap">
      ${years.length > 1 ? `<div class="recap-years">${yearNav}</div>` : ''}
      <div class="recap-hero"><span class="recap-big">${reads.length}</span> book${reads.length === 1 ? '' : 's'} read in <b>${y}</b></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Pages</div><div class="stat-number" id="recap-pages">—</div><div class="stat-suffix">turned</div></div>
        <div class="stat-card"><div class="stat-label">Reading time</div><div class="stat-number" id="recap-hours">—</div><div class="stat-suffix">hours, roughly</div></div>
        <div class="stat-card"><div class="stat-label">Avg score</div><div class="stat-number ${avgBand ? avgBand.cls : ''}">${avg != null ? avg : '—'}</div><div class="stat-suffix">${avgBand ? avgBand.label : 'unrated'}</div></div>
        <div class="stat-card"><div class="stat-label">Reviews</div><div class="stat-number">${reviewCount}</div><div class="stat-suffix">member ratings</div></div>
      </div>
      ${top ? `<div class="card no-rule" style="margin-top:12px;"><div class="mini-head">Best of ${y}</div>${recapReadRow(top)}</div>` : ''}
      ${low ? `<div class="card no-rule" style="margin-top:12px;"><div class="mini-head">Lowest rated</div>${recapReadRow(low)}</div>` : ''}
      ${topReader ? `<div class="card no-rule" style="margin-top:12px;"><div class="mini-head">Most picked</div><div class="recap-reader">${topReader.id && userAvatar(topReader.id) ? `<img class="avatar-mini" src="${attr(userAvatar(topReader.id))}" alt="">` : ''}<a class="reader-link" href="${readerHref(topReader.id, topReader.name)}"><b>${esc(topReader.name || 'Reader')}</b></a> — ${topReader.count} pick${topReader.count === 1 ? '' : 's'}</div></div>` : ''}
      <div class="card no-rule" style="margin-top:12px;"><div class="mini-head">Every read in ${y}</div>${reads.map(recapReadRow).join("")}</div>
    </div>`;
  decorateCovers();
  decorateRecapMeta(reads);
}
async function decorateRecapMeta(reads) {
  const metas = await Promise.all(reads.map(h => resolveBookMeta(h.book)));
  if (parseRoute().name !== "recap") return; // navigated away
  let totalPages = 0;
  metas.forEach(m => { if (m && m.pages) totalPages += m.pages; });
  const p = document.getElementById("recap-pages");
  const hh = document.getElementById("recap-hours");
  if (p) p.textContent = totalPages ? totalPages.toLocaleString() : "—";
  if (hh) hh.textContent = totalPages ? Math.max(1, Math.round(totalPages * 1.6 / 60)).toLocaleString() : "—";
}

function parseRoute() {
  const hash = location.hash || "";
  const book = hash.match(/^#book=(\d+)$/);
  if (book) return { name: "book", round: parseInt(book[1], 10) };
  const shelf = hash.match(/^#shelf=(.+)$/);
  if (shelf) return { name: "shelf", userId: decodeURIComponent(shelf[1]) };
  const tag = hash.match(/^#tag=(.+)$/);
  if (tag) return { name: "tag", tag: decodeURIComponent(tag[1]) };
  const reader = hash.match(/^#reader=(.+)$/);
  if (reader) return { name: "reader", key: decodeURIComponent(reader[1]) };
  const recap = hash.match(/^#recap(?:=(\d{4}))?$/);
  if (recap) return { name: "recap", year: recap[1] ? parseInt(recap[1], 10) : null };
  // Phase 4: creating and joining are routes of their own, matched before the
  // club route so /c/new and a club slugged "join" can't collide with them.
  if (/^#\/new\/?$/.test(hash)) return { name: "new-club" };
  if (/^#\/account\/?$/.test(hash)) return { name: "account" };
  if (/^#\/legal\/?$/.test(hash)) return { name: "legal" };
  const join = hash.match(/^#\/join\/([A-Za-z0-9]+)\/?$/);
  if (join) return { name: "join", code: join[1].toUpperCase() };
  // clubSlug is resolved against the `clubs` table as of Phase 4 slice 4b --
  // see resolveClubFromRoute(). A route with no slug (including every older
  // #book=/#shelf=/#reader= detail route) means "the default club".
  // The optional third segment is the librarian dashboard's sub-section
  // (#/c/<slug>/admin/settings). It's optional so every two-segment URL already
  // in someone's bookmarks keeps resolving, landing on the default sub-section.
  const club = hash.match(/^#\/c\/([^/]+)\/?([a-z]*)\/?([a-z]*)$/);
  if (club) return { name: "main", clubSlug: decodeURIComponent(club[1]), tab: club[2] || null, sub: club[3] || null };
  return { name: "main", clubSlug: null, tab: null, sub: null };
}

function tabHash(id, sub) {
  return sub ? `#/c/${clubSlug()}/${id}/${sub}` : `#/c/${clubSlug()}/${id}`;
}

function goToTab(id, sub) {
  const target = tabHash(id, sub);
  if (location.hash === target) {
    // Already there -- hashchange won't fire, so drive the render ourselves.
    currentTab = id;
    if (sub) currentSubTab = sub;
    render();
  } else {
    location.hash = target;
  }
}

function wireAccount() {
  const nameInput = document.getElementById("acct-name");
  document.getElementById("acct-name-save")?.addEventListener("click", (e) => {
    e.currentTarget.blur();
    saveDisplayName(nameInput?.value ?? "");
  });
  nameInput?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); saveDisplayName(e.currentTarget.value); }
  });
  document.getElementById("acct-name-reset")?.addEventListener("click", (e) => {
    e.currentTarget.blur();
    resetDisplayName();
  });

  // Phase 11 §4.4: own row, direct RLS write -- same pattern as
  // shelf_comment_reactions, no edge function needed.
  document.getElementById("acct-mention")?.addEventListener("change", async (e) => {
    const checked = e.currentTarget.checked;
    e.currentTarget.blur();
    const { error } = await supabase
      .from("notification_prefs")
      .upsert(
        { club_id: clubId(), user_id: session.user.id, mention_winner: checked, updated_at: new Date().toISOString() },
        { onConflict: "club_id,user_id" },
      );
    if (error) { setFlash("err", friendlyError(error, "save that")); render(); return; }
    myNotificationPrefs = { mention_winner: checked };
    setFlash("info", "Saved.");
    render();
  });

  document.getElementById("acct-delete")?.addEventListener("click", async (e) => {
    e.currentTarget.blur();
    // The server requires this exact phrase too and re-checks it, along with the
    // "you're the only librarian somewhere" guard -- this prompt is a speed bump,
    // not the guard.
    const typed = await promptModal(
      "This permanently deletes your account, your memberships, and every review and comment you've written. Your past picks stay in each club's ledger under your name. Type DELETE MY ACCOUNT to confirm.",
      { title: "Delete your account?", placeholder: "DELETE MY ACCOUNT", confirmLabel: "Delete my account", danger: true, requireMatch: "DELETE MY ACCOUNT" },
    );
    if (typed === null) return;
    const body = await callClubAdmin("delete_account", { confirm: typed });
    if (!body?.ok) { render(); return; }
    // Nothing left to be signed in as.
    await supabase.auth.signOut();
    location.hash = "";
    location.reload();
  });
}

// ctx is { kind: "past", round } or { kind: "shelf", userId }. Past reads are
// keyed by round and shelf books by the reader's id, so the same title picked
// by several people still resolves to distinct pages.
// Book-level superlative badges for a single read, mirroring the Reviewers'
// corner: divisiveness comes from the spread of member-review totals, and the
// top/bottom badges from the committed Guild scores. A read only earns a badge
// when it's the extreme across the whole shelf (needs ≥2 books to compare).
function bookBadges(h) {
  if (!h) return [];
  const badges = [];
  // Spread-based, from member reviews (same math as reviewSuperlatives). DNF
  // entries carry no score, so they're excluded.
  const byBook = {};
  for (const r of reviews) { if (!r.dnf) (byBook[r.book_ts] ||= []).push(reviewTotal(r)); }
  const spreads = [];
  for (const [ts, totals] of Object.entries(byBook)) {
    if (totals.length < 2) continue;
    const mean = totals.reduce((a, b) => a + b, 0) / totals.length;
    const sd = Math.sqrt(totals.reduce((a, b) => a + (b - mean) ** 2, 0) / totals.length);
    spreads.push({ ts, sd });
  }
  if (spreads.length >= 2) {
    const mostDivisive = spreads.reduce((m, x) => (x.sd > m.sd ? x : m));
    const mostAgreed = spreads.reduce((m, x) => (x.sd < m.sd ? x : m));
    if (mostDivisive.ts === h.ts) badges.push({ emoji: "🔥", label: "Most divisive" });
    else if (mostAgreed.ts === h.ts) badges.push({ emoji: "🤝", label: "Most agreed-upon" });
  }
  // Score-based, from the committed Guild ratings.
  const rated = state.history.filter(x => ratingTotal(x) != null);
  if (rated.length >= 2) {
    const top = rated.reduce((m, x) => (ratingTotal(x) > ratingTotal(m) ? x : m));
    const bottom = rated.reduce((m, x) => (ratingTotal(x) < ratingTotal(m) ? x : m));
    if (top.ts === h.ts) badges.push({ emoji: "⭐", label: "Top rated" });
    else if (bottom.ts === h.ts) badges.push({ emoji: "💀", label: "Lowest rated" });
  }
  return badges;
}

// The review block for a past read: the committed (or live) /100 score, the
// per-category breakdown, each member's scores + notes, and a rate button.
function guildReviewHtml(h) {
  const committed = ratingTotal(h);
  // Per-category source: a committed read always renders its own locked-in
  // snapshot (Phase 10) -- the rubric it was actually scored under, labels
  // and all -- never today's live config, which may have since renamed or
  // dropped a category. An in-progress read has no snapshot yet, so it shows
  // the live member-review average instead.
  const agg = committed == null ? aggregateRubric(h.ts) : null;
  let cats = null;
  let catList = RUBRIC; // { key, label } source for the breakdown below
  let catScale = RATING_SCALE;
  if (committed != null && h.rating) {
    const profile = ratingProfileFor(h);
    catList = profile.categories.map(c => ({ key: c.slot, label: c.label }));
    catScale = profile.scale;
    cats = {};
    for (const { key } of catList) {
      const v = Number(h.rating[key]);
      if (Number.isFinite(v)) cats[key] = v;
    }
    if (!Object.keys(cats).length) cats = null;
  } else if (agg) {
    cats = agg.cats;
  }
  const headTotal = committed != null ? committed : (agg ? agg.total : null);
  const headBand = committed != null ? ratingBand(committed) : (agg ? agg.band : null);
  const dnfCount = reviewsFor(h.ts).filter(r => r.dnf).length;
  const dnfSuffix = dnfCount ? ` · ${dnfCount} DNF` : '';

  let html = `<div class="bd-block bd-review ${headBand ? headBand.cls : ''}"><div class="bd-block-head">${esc(scoreLabel())} review</div>`;
  const badges = bookBadges(h);
  if (badges.length) {
    html += `<div class="bd-badges">${badges.map(b => `<span class="bd-badge">${b.emoji} ${esc(b.label)}</span>`).join("")}</div>`;
  }
  if (headTotal != null) {
    html += `<div class="bd-review-row"><span class="bd-score">${headTotal}<span class="bd-score-max">/100</span></span>`;
    html += `<span class="score-pill ${headBand.cls}">${headBand.label}</span>`;
    html += committed != null
      ? `<span class="bn-review-count">Locked in${agg ? ` · ${agg.count} review${agg.count === 1 ? '' : 's'}` : ''}${dnfSuffix}</span>`
      : `<span class="bn-review-count">Live · ${agg.count} review${agg.count === 1 ? '' : 's'} so far${dnfSuffix}</span>`;
    html += `</div>`;
  } else if (dnfCount) {
    html += `<div class="bn-review-count">${dnfCount} DNF so far — no scores yet.</div>`;
  } else {
    html += `<div class="bn-review-count">No reviews yet.</div>`;
  }

  if (cats) {
    html += `<div class="bd-rubric" style="margin-top:14px;">`;
    for (const { key, label } of catList) {
      const v = cats[key];
      if (v == null) continue;
      const b = categoryBand(v, catScale);
      const pct = Math.max(0, Math.min(100, (v / catScale) * 100));
      html += `<div class="bd-rubric-row ${b ? b.cls : ''}">
        <span class="bd-rubric-label">${esc(label)}</span>
        <span class="bd-rubric-bar"><span style="width:${pct}%"></span></span>
        <span class="bd-rubric-num">${v.toFixed(1)} · ${b ? b.label : '—'}</span>
      </div>`;
    }
    html += `</div>`;
  }

  const rs = reviewsFor(h.ts);
  if (rs.length) {
    html += `<div class="bd-reviewers">`;
    for (const r of rs) {
      const u = users.find(x => x.id === r.user_id);
      const name = u?.discord_username || "Reader";
      const av = u?.avatar_url;
      if (r.dnf) {
        html += `<div class="bd-reviewer">
          <div class="bd-reviewer-head">${av ? `<img class="avatar-mini" src="${attr(av)}" alt="">` : ''}<a class="reader-link" href="${readerHref(r.user_id, name)}"><b>${esc(name)}</b></a> · <span class="score-pill score-pill-empty">Didn’t finish</span></div>
          ${r.note ? `<div class="bd-reviewer-note">“${esc(r.note)}”</div>` : ""}
        </div>`;
        continue;
      }
      const t = reviewTotal(r);
      const b = ratingBand(t);
      html += `<div class="bd-reviewer">
        <div class="bd-reviewer-head">${av ? `<img class="avatar-mini" src="${attr(av)}" alt="">` : ''}<a class="reader-link" href="${readerHref(r.user_id, name)}"><b>${esc(name)}</b></a> · ${t}/100 <span class="score-pill ${b.cls}">${b.label}</span></div>
        <div class="bd-reviewer-scores">${RUBRIC.filter(({ key }) => r[key] != null).map(({ key, short }) => `${esc(short)} ${r[key]}`).join(" · ")}</div>
        ${r.note ? `<div class="bd-reviewer-note">“${esc(r.note)}”</div>` : ""}
      </div>`;
    }
    html += `</div>`;
  }

  // Rating is only possible on the current read while ratings are open — never
  // retroactively on a past read.
  if (session && isCurrentRead(h) && ratingsOpen(h)) {
    const mine = myReviewFor(h.ts);
    html += `<div class="bn-review-actions" style="margin-top:14px;">
      <button class="btn-mini" data-rate-ts="${attr(h.ts || "")}">${mine && !mine.dnf ? "Edit my review" : "Rate this read"}</button>
      <button class="btn-mini ghost" data-dnf-ts="${attr(h.ts || "")}">${mine && mine.dnf ? "Edit DNF note" : "Didn’t finish it?"}</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

// One comment or reply's markup (avatar, name, time, delete-if-mine, body,

          ${session ? `<details class="react-menu"><summary class="react-add" aria-label="Add a reaction">＋</summary><div class="react-palette">${REACTION_EMOJI.map(e => `<button class="react-opt" data-react-comment="${attr(c.id)}" data-react-emoji="${e}" aria-label="React ${e}">${e}</button>`).join("")}</div></details>` : ''}

// The per-book discussion thread: existing comments (+ single-level replies)
// and a compose box.
function discussionHtml(bookTs) {
  const cs = commentsFor(bookTs);
  const total = cs.reduce((n, c) => n + 1 + repliesFor(c.id).length, 0);
  let html = `<div class="bd-block bd-discussion"><div class="bd-block-head">Discussion${total ? ` · ${total}` : ''}</div>`;
  if (cs.length) {
    html += `<div class="bd-comments">`;
    for (const c of cs) {
      html += commentItemHtml(c);
      const replies = repliesFor(c.id);
      if (replies.length || replyingTo === c.id) {
        html += `<div class="bd-comment-replies">`;
        for (const r of replies) html += commentItemHtml(r, { isReply: true });
        if (replyingTo === c.id) {
          html += `<div class="bd-comment-form">
            <textarea id="reply-input" class="rubric-note" maxlength="2000" placeholder="Reply…"></textarea>
            <div class="bd-comment-formfoot">
              <span class="bd-comment-hint">⌘/Ctrl+Enter to post</span>
              <span class="bd-comment-count" id="reply-count">0 / 2000</span>
              <button class="btn-mini ghost" data-comment-reply-cancel="1">Cancel</button>
              <button class="btn-mini" data-comment-post="${attr(bookTs)}" data-parent-id="${attr(c.id)}">Post</button>
            </div>
          </div>`;
        }
        html += `</div>`;
      }
    }
    html += `</div>`;
  } else {
    html += `<div class="empty-note">No comments yet — start the discussion.</div>`;
  }
  if (session) {
    html += `<div class="bd-comment-form">
      <textarea id="comment-input" class="rubric-note" maxlength="2000" placeholder="Add to the discussion…"></textarea>
      <div class="bd-comment-formfoot">
        <span class="bd-comment-hint">⌘/Ctrl+Enter to post</span>
        <span class="bd-comment-count" id="comment-count">0 / 2000</span>
        <button class="btn-mini" data-comment-post="${attr(bookTs)}">Post</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function renderBookDetail(app, ctx) {
  const back = `<a href="#" class="detail-back">← Back to the shelf</a>`;

  let book, eyebrow, metaLine, reviewHtml = "", discussionBlock = "", meetingsHtml = "", stampHtml = "";
  if (ctx.kind === "past") {
    const h = state.history.find(e => e.round === ctx.round);
    if (!h) return renderDetailMissing(app, back, state.history.length === 0, `There's no past read for round ${ctx.round}.`);
    book = h.book;
    // Unrated picks are in flight: the oldest is "Currently reading", newer ones
    // are "Next up". Rated picks are finished ("Past read"). Mirrors render().
    const unrated = state.history.filter(x => ratingTotal(x) == null);
    const current = unrated.length ? unrated[unrated.length - 1] : null;
    const status = current && h.ts === current.ts ? "Currently reading"
      : ratingTotal(h) == null ? "Next up" : null;
    eyebrow = `${status || "Past read"} · Round ${h.round}`;
    if (status) stampHtml = `<div class="detail-stamp">${esc(status)}</div>`;
    const avatar = h.winner_id ? userAvatar(h.winner_id) : null;
    const who = h.winner_username
      ? `${avatar ? `<img class="avatar-mini" src="${attr(avatar)}" alt="">` : ''}<a class="reader-link" href="${readerHref(h.winner_id, h.winner_username)}"><b>${esc(h.winner_username)}</b></a>`
      : `<span class="detail-muted">no picker recorded</span>`;
    metaLine = `Picked by ${who} · Round ${h.round} · ${fmtDate(h.ts)}`;
    reviewHtml = guildReviewHtml(h);
    discussionBlock = discussionHtml(h.ts);
    meetingsHtml = bookMeetingsHtml(h);
  } else {
    const u = users.find(x => x.id === ctx.userId);
    if (!u || !(u.book || "").trim()) return renderDetailMissing(app, back, users.length === 0, `That book isn't on the shelf anymore.`);
    book = u.book;
    eyebrow = `On the shelf`;
    const avatar = u.avatar_url || null;
    metaLine = `Added by ${avatar ? `<img class="avatar-mini" src="${attr(avatar)}" alt="">` : ''}<a class="reader-link" href="${readerHref(u.id, u.discord_username)}"><b>${esc(u.discord_username || "Reader")}</b></a>`;
  }

  app.innerHTML = `
    <header><div class="eyebrow">The Shelf</div><h1>${esc(eyebrow)}</h1><div class="rule"></div></header>
    ${back}
    <div class="book-detail">
      <div class="bd-top">
        <div class="cover-slot xl" id="bd-cover"></div>
        <div class="bd-head">
          ${stampHtml}
          <div class="bd-title">${esc(book || '—')}</div>
          <div class="bd-author" id="bd-author"></div>
          <div class="bd-facts" id="bd-facts"><span class="detail-muted">Looking up…</span></div>
          <div class="bd-pick">${metaLine}</div>
        </div>
      </div>
      ${meetingsHtml}
      ${reviewHtml}
      <div id="bd-desc"></div>
      <div id="bd-firstline"></div>
      <div id="bd-subjects"></div>
      <div id="bd-people"></div>
      <div id="bd-extra"></div>
      ${discussionBlock}
    </div>`;

  decorateBookDetail(book);
}

async function decorateBookDetail(book) {
  const hashAtCall = location.hash;
  const detail = await resolveBookDetail(book);
  if (location.hash !== hashAtCall) return; // navigated away

  const cover = document.getElementById("bd-cover");
  if (cover && !cover.dataset.done) {
    cover.dataset.done = "1";
    if (detail.coverLarge) insertCoverImg(cover, detail.coverLarge);
    else cover.classList.add("no-cover");
  }
  const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

  set("bd-author", detail.authors.length ? `by ${esc(detail.authors.join(", "))}` : "");

  const facts = [];
  if (detail.year) facts.push(`First published ${detail.year}`);
  if (detail.pages) facts.push(`${detail.pages} pages`);
  if (detail.editionCount) facts.push(`${detail.editionCount} edition${detail.editionCount === 1 ? '' : 's'}`);
  set("bd-facts", facts.length
    ? facts.map(f => `<span>${esc(f)}</span>`).join(`<span class="dot">·</span>`)
    : `<span class="detail-muted">No catalog data found on Open Library.</span>`);

  set("bd-desc", detail.description ? `<div class="bd-desc">${esc(detail.description)}</div>` : "");
  set("bd-firstline", detail.firstSentence ? `<div class="bd-quote">“${esc(detail.firstSentence)}”</div>` : "");

  const subs = [...new Set(cleanSubjects(detail.subjects))].slice(0, 16);
  set("bd-subjects", subs.length
    ? `<div class="bd-block"><div class="bd-block-head">Subjects</div><div class="genre-tags">${subs.map(s => `<a class="genre-tag genre-tag-link" href="#tag=${encodeURIComponent(s)}">${esc(titleCase(s))}</a>`).join("")}</div></div>`
    : "");

  const chip = (arr) => arr.map(s => `<span class="genre-tag">${esc(s)}</span>`).join("");
  let people = "";
  if (detail.persons.length) people += `<div class="bd-block"><div class="bd-block-head">Characters</div><div class="genre-tags">${chip(detail.persons)}</div></div>`;
  if (detail.places.length) people += `<div class="bd-block"><div class="bd-block-head">Settings</div><div class="genre-tags">${chip(detail.places)}</div></div>`;
  set("bd-people", people);

  const extra = [];
  if (detail.publishers.length) extra.push(`<div><span class="bd-k">Publisher</span> ${esc(detail.publishers.join(", "))}</div>`);
  if (detail.isbn.length) extra.push(`<div><span class="bd-k">ISBN</span> ${esc(detail.isbn[0])}</div>`);
  if (detail.goodreadsId) extra.push(`<div><a class="footer-link" href="https://www.goodreads.com/book/show/${attr(detail.goodreadsId)}" target="_blank" rel="noopener">View on Goodreads ↗</a></div>`);
  if (detail.amazonId) extra.push(`<div><a class="footer-link" href="https://www.amazon.ca/dp/${attr(detail.amazonId)}" target="_blank" rel="noopener">View on Amazon ↗</a></div>`);
  if (detail.olKey) extra.push(`<div><a class="footer-link" href="https://openlibrary.org${attr(detail.olKey)}" target="_blank" rel="noopener">View on Open Library ↗</a></div>`);
  set("bd-extra", extra.length ? `<div class="bd-block bd-extra">${extra.join("")}</div>` : "");
}

// Tag page: past reads that carry a given subject (from "What we've been

async function decorateTagPage(tag) {
  const hashAtCall = location.hash;
  const entries = state.history.filter(h => h.book);
  const metas = await Promise.all(entries.map(h => resolveBookMeta(h.book)));
  if (location.hash !== hashAtCall) return; // navigated away
  const box = document.getElementById("tag-list");
  if (!box) return;
  const matches = entries.filter((h, i) => cleanSubjects((metas[i] || {}).subjects).includes(tag));
  if (matches.length === 0) {
    box.innerHTML = `<div class="empty-note">No past reads tagged “${esc(titleCase(tag))}”.</div>`;
    return;
  }
  box.innerHTML = matches.map(h => {
    const avatar = h.winner_id ? userAvatar(h.winner_id) : null;
    const total = ratingTotal(h);
    const band = ratingBand(total);
    return `
      <div class="history-item">
        <span class="cover-slot tiny" data-cover-title="${attr(h.book)}"></span>
        <span class="h-content">
          ${h.winner_username ? `${avatar ? `<img class="avatar-mini" src="${attr(avatar)}" alt="">` : ''}<a class="h-who reader-link" href="${readerHref(h.winner_id, h.winner_username)}">${esc(h.winner_username)}</a> — ` : ''}<a class="book-link" href="#book=${h.round}">${esc(h.book)}</a><span class="book-meta" data-meta-title="${attr(h.book)}"></span>
        </span>
        <span class="h-meta">Round ${h.round} · ${fmtDate(h.ts)}</span>
        ${band ? `<span class="score-pill ${band.cls}" title="${band.label} · ${total}/100">${total}</span>` : `<span class="score-pill" style="visibility:hidden">00</span>`}
      </div>`;
  }).join("");
  decorateCovers();
  decorateMeta();
}

// Reader profile: a picker's stats + their picks. key is a Discord id or
// "name:<name>" for unlinked pickers.
function renderReaderPage(app, key) {
  const back = `<a href="#" class="detail-back">← Back to the shelf</a>`;

  let name = "Reader", avatar = null, userId = null;
  if (key.startsWith("name:")) {
    name = key.slice(5) || "Reader";
  } else {
    userId = key;
    const u = users.find(x => x.id === key);
    if (u) { name = u.discord_username || "Reader"; avatar = u.avatar_url || null; }
    else { const h = state.history.find(e => e.winner_id === key); if (h) name = h.winner_username; }
  }

  const picks = state.history.filter(h => readerKey(h.winner_id, h.winner_username) === key);
  const shelfUser = userId ? users.find(x => x.id === userId) : null;
  const shelfBook = shelfUser && (shelfUser.book || "").trim() ? shelfUser.book.trim() : null;
  const isMe = !!(session && userId && userId === session.user.id);
  // A reader may be reachable purely as a reviewer (their name is clickable in
  // review/comment lists) without ever having picked a book — still show them.
  const hasReviews = userId ? reviews.some(r => r.user_id === userId) : false;

  // Always render your own profile (even brand-new, so the welcome card shows).
  if (!isMe && picks.length === 0 && !shelfBook && !hasReviews) {
    return renderDetailMissing(app, back, state.history.length === 0 && users.length === 0, `No reads recorded for ${name}.`);
  }

  const rated = picks.map(ratingTotal).filter(t => t != null);
  const avg = rated.length ? Math.round(rated.reduce((a, b) => a + b, 0) / rated.length) : null;
  const avgBand = ratingBand(avg);
  const best = rated.length ? Math.max(...rated) : null;
  const worst = rated.length ? Math.min(...rated) : null;
  const sorted = [...picks].sort((a, b) => {
    const ra = ratingTotal(a), rb = ratingTotal(b);
    if (ra == null && rb == null) return b.round - a.round;
    if (ra == null) return 1;
    if (rb == null) return -1;
    if (rb !== ra) return rb - ra;
    return b.round - a.round;
  });

  let html = `
    <header><div class="eyebrow">The Shelf</div><h1>Reader</h1><div class="rule"></div></header>
    ${back}
    <div class="reader-head">
      ${avatar ? `<img class="reader-avatar" src="${attr(avatar)}" alt="">` : `<span class="reader-avatar reader-avatar-ph"></span>`}
      <div class="reader-name">${esc(name)}</div>
    </div>
    ${isMe ? ownProfileCardHtml() : ''}
    <div class="stat-grid reader-stats">
      <div class="stat-card"><div class="stat-label">Books picked</div><div class="stat-number">${picks.length}</div><div class="stat-suffix">all rounds</div></div>
      <div class="stat-card"><div class="stat-label">Avg rating</div><div class="stat-number ${avgBand ? avgBand.cls : ''}">${avg != null ? avg : '—'}</div><div class="stat-suffix">${avgBand ? avgBand.label : 'unrated'}</div></div>
      <div class="stat-card"><div class="stat-label">Best</div><div class="stat-number ${ratingBand(best) ? ratingBand(best).cls : ''}">${best != null ? best : '—'}</div><div class="stat-suffix">highest pick</div></div>
      <div class="stat-card"><div class="stat-label">Worst</div><div class="stat-number ${ratingBand(worst) ? ratingBand(worst).cls : ''}">${worst != null ? worst : '—'}</div><div class="stat-suffix">lowest pick</div></div>
    </div>`;

  if (picks.length) {
    html += `<div class="card no-rule reader-extra">
      <span class="reader-extra-item">📖 <b id="reader-pages">…</b> pages picked</span>
      <span class="reader-extra-item">🏷️ Favorite genre: <b id="reader-genre">…</b></span>
    </div>`;
  }

  if (shelfBook && !isMe) {
    html += `<div class="card no-rule reader-shelf"><span class="mini-head" style="margin:0 10px 0 0;">On the shelf now</span><a class="book-link" href="#shelf=${encodeURIComponent(userId)}">${esc(shelfBook)}</a></div>`;
  }

  html += `<section style="margin-top:16px;"><div class="section-title">Picks</div>`;
  if (picks.length === 0) {
    html += `<div class="empty-note">No picks have come up yet.</div>`;
  } else {
    html += `<div class="card no-rule">`;
    sorted.forEach(h => {
      const total = ratingTotal(h);
      const band = ratingBand(total);
      html += `
        <div class="history-item">
          <span class="cover-slot tiny" data-cover-title="${attr(h.book || '')}"></span>
          <span class="h-content"><a class="book-link" href="#book=${h.round}">${esc(h.book || '')}</a><span class="book-meta" data-meta-title="${attr(h.book || '')}"></span></span>
          <span class="h-meta">Round ${h.round} · ${fmtDate(h.ts)}</span>
          ${band ? `<span class="score-pill ${band.cls}" title="${band.label} · ${total}/100">${total}</span>` : `<span class="score-pill" style="visibility:hidden">00</span>`}
        </div>`;
    });
    html += `</div>`;
  }
  html += `</section>`;

  // ---- This reader's personal rankings ----
  // Every past read this reader has scored, ranked best→worst by *their own*
  // rubric total (/100) — distinct from Picks (books they chose, club-scored).
  // DNF entries carry no score, so they're listed separately below rather than
  // ranked. Only linked accounts (a real user id) carry reviews; name-based
  // profiles have none, so the section simply doesn't appear for them.
  if (userId) {
    const myReviewRows = reviews.filter(r => r.user_id === userId);
    const mine = myReviewRows
      .filter(r => !r.dnf)
      .map(r => {
        const h = state.history.find(e => e.ts === r.book_ts);
        return h ? { h, total: reviewTotal(r) } : null;
      })
      .filter(Boolean)
      .sort((a, b) => (b.total - a.total) || (b.h.round - a.h.round));
    const dnfs = myReviewRows
      .filter(r => r.dnf)
      .map(r => state.history.find(e => e.ts === r.book_ts))
      .filter(Boolean)
      .sort((a, b) => b.round - a.round);

    if (mine.length) {
      const possessive = `${name}${/s$/i.test(name) ? "’" : "’s"}`;
      html += `<section style="margin-top:16px;"><div class="section-title">${esc(possessive)} rankings</div>`;
      html += `<div class="empty-note">${mine.length} book${mine.length === 1 ? "" : "s"} reviewed, ranked by ${esc(name)}’s own score.</div>`;
      html += `<div class="card no-rule">`;
      mine.forEach((item, i) => {
        const h = item.h;
        const band = ratingBand(item.total);
        html += `
        <div class="history-item">
          <span class="cover-slot tiny" data-cover-title="${attr(h.book || '')}"></span>
          <span class="h-content"><a class="book-link" href="#book=${h.round}">${esc(h.book || '')}</a><span class="book-meta" data-meta-title="${attr(h.book || '')}"></span></span>
          <span class="h-meta">#${i + 1} · Round ${h.round}</span>
          <span class="score-pill ${band.cls}" title="${esc(name)}’s score · ${band.label} · ${item.total}/100">${item.total}</span>
        </div>`;
      });
      html += `</div></section>`;
    }

    if (dnfs.length) {
      html += `<section style="margin-top:16px;"><div class="section-title">Didn’t finish</div>`;
      html += `<div class="card no-rule">`;
      dnfs.forEach(h => {
        html += `
        <div class="history-item">
          <span class="cover-slot tiny" data-cover-title="${attr(h.book || '')}"></span>
          <span class="h-content"><a class="book-link" href="#book=${h.round}">${esc(h.book || '')}</a><span class="book-meta" data-meta-title="${attr(h.book || '')}"></span></span>
          <span class="h-meta">Round ${h.round}</span>
          <span class="score-pill score-pill-empty">DNF</span>
        </div>`;
      });
      html += `</div></section>`;
    }
  }

  app.innerHTML = html;
  decorateCovers();
  decorateMeta();
  decorateReaderExtra(picks.map(h => h.book).filter(Boolean));
}

// Pages picked + favorite genre for a reader, from the metadata of their picks.
async function decorateReaderExtra(books) {
  if (!document.getElementById("reader-pages")) return;
  const metas = await Promise.all(books.map(resolveBookMeta));
  if (parseRoute().name !== "reader") return; // navigated away
  let pages = 0;
  const tally = {};
  metas.forEach(m => {
    if (m && m.pages) pages += m.pages;
    const seen = new Set();
    cleanSubjects(m && m.subjects).forEach(s => {
      if (s === "fiction") return; // too generic to be a "favorite genre"
      if (!seen.has(s)) { seen.add(s); tally[s] = (tally[s] || 0) + 1; }
    });
  });
  const top = Object.entries(tally).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0];
  const pg = document.getElementById("reader-pages");
  const gn = document.getElementById("reader-genre");
  if (pg) pg.textContent = pages ? pages.toLocaleString() : "—";
  if (gn) gn.textContent = top ? titleCase(top[0]) : "—";
}

function wireLoginGate() {
